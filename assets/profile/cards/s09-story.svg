<svg xmlns="http://www.w3.org/2000/svg" width="294" height="206" viewBox="0 0 294 206" role="img" aria-label="story-forge. A whole film studio on one laptop. A director keeps going until every shot passes a local vision judge, then cuts, scores and voices the film. Two finished films, no cloud.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7e22ce"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<rect width="294" height="206" rx="14" fill="url(#g)"/><rect x=".5" y=".5" width="293" height="205" rx="14" fill="none" stroke="#d8b4fe" stroke-opacity=".45"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="18" y="42" font-size="19" font-weight="800" fill="#d8b4fe">🎬 story-forge</text><text x="18" y="73" font-size="16" fill="#ffffff">A whole film studio on one</text><text x="18" y="96" font-size="16" fill="#ffffff">laptop. A director keeps going</text><text x="18" y="119" font-size="16" fill="#ffffff">until every shot passes a local</text><text x="18" y="142" font-size="16" fill="#ffffff">vision judge, then cuts, scores</text><text x="18" y="165" font-size="16" fill="#ffffff">and voices the film. Two finished</text><text x="18" y="188" font-size="16" fill="#ffffff">films, no cloud.</text></g></svg>
