<svg xmlns="http://www.w3.org/2000/svg" width="294" height="348" viewBox="0 0 294 348" role="img" aria-label="Browser Broker. One logged-in browser, many agents, nobody fights. Leases each agent an ordinary background tab in your real browser, with your real logins, and every agent sees only its own. ~300 lines, one dependency. Verified on Linux by a stranger who then found a bug in my own docs. Chrome DevTools Protocol · Multi-agent · Local AI.">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<rect width="294" height="348" rx="14" fill="url(#g)"/><rect x=".5" y=".5" width="293" height="347" rx="14" fill="none" stroke="#c4b5fd" stroke-opacity=".45"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><text x="18" y="42" font-size="19" font-weight="800" fill="#c4b5fd">🤝 Browser Broker</text><text x="18" y="73" font-size="16" fill="#ffffff">One logged-in browser, many</text><text x="18" y="96" font-size="16" fill="#ffffff">agents, nobody fights. Leases</text><text x="18" y="119" font-size="16" fill="#ffffff">each agent an ordinary</text><text x="18" y="142" font-size="16" fill="#ffffff">background tab in your real</text><text x="18" y="165" font-size="16" fill="#ffffff">browser, with your real logins,</text><text x="18" y="188" font-size="16" fill="#ffffff">and every agent sees only its</text><text x="18" y="211" font-size="16" fill="#ffffff">own. ~300 lines, one</text><text x="18" y="234" font-size="16" fill="#ffffff">dependency. Verified on Linux by</text><text x="18" y="257" font-size="16" fill="#ffffff">a stranger who then found a bug</text><text x="18" y="280" font-size="16" fill="#ffffff">in my own docs.</text><text x="18" y="309" font-size="15" font-weight="700" fill="#c4b5fd">Chrome DevTools Protocol ·</text><text x="18" y="330" font-size="15" font-weight="700" fill="#c4b5fd">Multi-agent · Local AI</text></g></svg>
