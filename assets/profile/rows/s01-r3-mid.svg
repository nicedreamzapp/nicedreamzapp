<svg xmlns="http://www.w3.org/2000/svg" width="560" height="148" viewBox="0 0 560 148" role="img" aria-label="Next: a robot that grows food. The bigger idea: robots that give people back what they have lost. Dozens of repos later I am somehow doing neuroscience, and every one of them still traces back to the coop."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6a8f"/><stop offset="1" stop-color="#4f5f99"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="276.1" height="148" rx="10"/></clipPath><rect width="276.1" height="148" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="275.1" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">🌱 Next: a robot that grows</text><text x="140" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#ffffff">food.</text><text x="140" text-anchor="middle" y="88" font-size="16" fill="#f1f4fa">The bigger idea: robots that give</text><text x="140" text-anchor="middle" y="111" font-size="16" fill="#f1f4fa">people back what they have</text><text x="140" text-anchor="middle" y="133" font-size="16" fill="#f1f4fa">lost.</text></g><g transform="translate(286.1,0)"><clipPath id="c0_1"><rect width="273.9" height="148" rx="10"/></clipPath><rect width="273.9" height="148" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="272.9" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="139" text-anchor="middle" y="36" font-size="16.5" font-style="italic" fill="#f1f4fa">Dozens of repos later I am</text><text x="139" text-anchor="middle" y="60" font-size="16.5" font-style="italic" fill="#f1f4fa">somehow doing neuroscience,</text><text x="139" text-anchor="middle" y="83" font-size="16.5" font-style="italic" fill="#f1f4fa">and every one of them still</text><text x="139" text-anchor="middle" y="107" font-size="16.5" font-style="italic" fill="#f1f4fa">traces back to the coop.</text></g></g></svg>
