<svg xmlns="http://www.w3.org/2000/svg" width="560" height="148" viewBox="0 0 560 148" role="img" aria-label="Next: a robot that grows food. The bigger idea: robots that give people back what they have lost. Dozens of repos later I am somehow doing neuroscience, and every one of them still traces back to the coop."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="276.1" height="148" rx="10"/></clipPath><rect width="276.1" height="148" rx="10" fill="url(#n)"/><rect width="276.1" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="275.1" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#c4dbd9">🌱 Next: a robot that grows</text><text x="140" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#c4dbd9">food.</text><text x="140" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">The bigger idea: robots that give</text><text x="140" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">people back what they have</text><text x="140" text-anchor="middle" y="133" font-size="16" font-weight="500" fill="#f2f5fa">lost.</text></g><g transform="translate(286.1,0)"><clipPath id="c0_1"><rect width="273.9" height="148" rx="10"/></clipPath><rect width="273.9" height="148" rx="10" fill="url(#n)"/><rect width="273.9" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="272.9" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><tex