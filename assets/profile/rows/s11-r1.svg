ks</text><text x="121" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Unicorns, dinosaurs,</text><text x="121" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">space, cats, Bluey.</text></g><g transform="translate(507.1,0)"><clipPath id="c0_2"><rect width="312.9" height="133" rx="10"/></clipPath><rect width="312.9" height="133" rx="10" fill="url(#n)"/><rect width="312.9" height="4" fill="#5f5f8f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="311.9" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="158" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d2d2df">📈 Difficulty that climbs</text><text x="158" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">It climbs as she masters skills and</text><text x="158" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">gently drops when she struggles.</text></g></g></svg>
