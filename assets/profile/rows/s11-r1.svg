<svg xmlns="http://www.w3.org/2000/svg" width="820" height="181" viewBox="0 0 820 181" role="img" aria-label="What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7f5f"/><stop offset="1" stop-color="#6a7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="226.1" height="181" rx="10"/></clipPath><rect width="226.1" height="181" rx="10" fill="url(#n)"/><rect width="226.1" height="4" fill="#4f7f5f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="225.1" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="115" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">🧺 What it does</text><text x="115" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">It plants, waters,</text><text x="115" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">weeds, harvests,</text><text x="115" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">carries the food in, and</text><text x="115" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">someday maybe cooks</text><text x="115" text-anchor="middle" y="165" font-size="17" font-weight="500" fill="#f2f5fa">it too.</text></g><g transform="translate(238.1,0)"><clipPath id="c0_1"><rect width="272.6" height="181" rx="10"/></clipPath><rect width="272.6" height="181" rx="10" fill="url(#n)"/><rect width="272.6" height="4" fill="#4f7f5f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="271.6" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="138" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">☀️ No grid, no cloud</text><text x="138" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">It charges from the sun and</text><text x="138" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">its whole brain lives inside it,</text><text x="138" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">so it keeps working where</text><text x="138" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">there&#x27;s no internet at all.</text></g><g transform="translate(522.8,0)"><clipPath id="c0_2"><rect width="297.2" height="181" rx="10"/></clipPath><rect width="297.2" height="181" rx="10" fill="url(#n)"/><rect width="297.2" height="4" fill="#4f7f5f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="296.2" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="151" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">🧩 Every repo on this page</text><text x="151" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#cddbd2">is a piece of it.</text><text x="151" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Right now I&#x27;m scraping the</text><text x="151" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">edges, but every piece works</text><text x="151" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">with the wifi off, and that&#x27;s on</text><text x="151" text-anchor="middle" y="165" font-size="17" font-weight="500" fill="#f2f5fa">purpose.</text></g></g></svg>
