<svg xmlns="http://www.w3.org/2000/svg" width="820" height="102" viewBox="0 0 820 102" role="img" aria-label="That needed AI running on my own hardware instead of somebody else&#x27;s cloud. That became RealTime AI Cam: it names 601 objects, fully offline. Along the way it turned out to help blind people see, with no internet."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="#161b22"/><rect width="4" height="102" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="17" fill="#c9d1d9">💻 That needed AI running on</text><text x="20" y="62" font-size="17" fill="#c9d1d9">my own hardware instead of</text><text x="20" y="86" font-size="17" fill="#c9d1d9">somebody else&#x27;s cloud.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="#161b22"/><rect width="4" height="102" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="17" fill="#c9d1d9">📷 That became RealTime AI</text><text x="20" y="62" font-size="17" fill="#c9d1d9">Cam: it names 601 objects,</text><text x="20" y="86" font-size="17" fill="#c9d1d9">fully offline.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="#161b22"/><rect width="4" height="102" fill="#6fbf8a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="17" fill="#c9d1d9">🦯 Along the way it turned out</text><text x="20" y="62" font-size="17" fill="#c9d1d9">to help blind people see, with</text><text x="20" y="86" font-size="17" fill="#c9d1d9">no internet.</text></g></g></svg>
