<svg xmlns="http://www.w3.org/2000/svg" width="820" height="181" viewBox="0 0 820 181" role="img" aria-label="Now picture a village. Now picture dropping two of them in a village where people are hungry and there&#x27;s no signal for a hundred miles. They dig the well, plant the rows, and bring in the harvest. That&#x27;s the science fiction story I&#x27;m building toward, and I think we&#x27;re closer to it than most people realize. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="319.7" height="181" rx="10"/></clipPath><rect width="319.7" height="181" rx="10" fill="#161b22"/><rect width="4" height="181" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="318.7" height="180" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🏘️ Now picture a village</text><text x="20" y="68" font-size="17" fill="#c9d1d9">Now picture dropping two of them in</text><text x="20" y="93" font-size="17" fill="#c9d1d9">a village where people are hungry</text><text x="20" y="117" font-size="17" fill="#c9d1d9">and there&#x27;s no signal for a hundred</text><text x="20" y="141" font-size="17" fill="#c9d1d9">miles. They dig the well, plant the</text><text x="20" y="165" font-size="17" fill="#c9d1d9">rows, and bring in the harvest.</text></g><g transform="translate(331.7,0)"><clipPath id="c0_1"><rect width="216.2" height="181" rx="10"/></clipPath><rect width="216.2" height="181" rx="10" fill="#161b22"/><rect width="4" height="181" fill="#d4a95a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="215.2" height="180" rx="10" fill="none" stroke="#30363d"/><text x="20" y="39" font-size="17.5" font-style="italic" fill="#c9d1d9">That&#x27;s the science</text><text x="20" y="64" font-size="17.5" font-style="italic" fill="#c9d1d9">fiction story I&#x27;m</text><text x="20" y="89" font-size="17.5" font-style="italic" fill="#c9d1d9">building toward, and I</text><text x="20" y="113" font-size="17.5" font-style="italic" fill="#c9d1d9">think we&#x27;re closer to</text><text x="20" y="138" font-size="17.5" font-style="italic" fill="#c9d1d9">it than most people</text><text x="20" y="163" font-size="17.5" font-style="italic" fill="#c9d1d9">realize.</text></g><g transform="translate(559.9,0)"><clipPath id="c0_2"><rect width="260.1" height="181" rx="10"/></clipPath><rect width="260.1" height="181" rx="10" fill="#161b22"/><rect width="4" height="181" fill="#6fbf8a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="259.1" height="180" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🧩 Every repo on this</text><text x="20" y="63" font-size="19" font-weight="700" fill="#e6edf3">page is a piece of it.</text><text x="20" y="93" font-size="17" fill="#c9d1d9">Right now I&#x27;m scraping the</text><text x="20" y="117" font-size="17" fill="#c9d1d9">edges, but every piece</text><text x="20" y="141" font-size="17" fill="#c9d1d9">works with the wifi off, and</text><text x="20" y="165" font-size="17" fill="#c9d1d9">that&#x27;s on purpose.</text></g></g></svg>
