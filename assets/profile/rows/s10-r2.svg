<svg xmlns="http://www.w3.org/2000/svg" width="820" height="181" viewBox="0 0 820 181" role="img" aria-label="Now picture a village. Now picture dropping two of them in a village where people are hungry and there&#x27;s no signal for a hundred miles. They dig the well, plant the rows, and bring in the harvest. That&#x27;s the science fiction story I&#x27;m building toward, and I think we&#x27;re closer to it than most people realize. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a46"/><stop offset="1" stop-color="#7d5a4f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="319.7" height="181" rx="10"/></clipPath><rect width="319.7" height="181" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="318.7" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="162" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ffffff">🏘️ Now picture a village</text><text x="162" text-anchor="middle" y="68" font-size="17" fill="#f1f4fa">Now picture dropping two of them in</text><text x="162" text-anchor="middle" y="93" font-size="17" fill="#f1f4fa">a village where people are hungry</text><text x="162" text-anchor="middle" y="117" font-size="17" fill="#f1f4fa">and there&#x27;s no signal for a hundred</text><text x="162" text-anchor="middle" y="141" font-size="17" fill="#f1f4fa">miles. They dig the well, plant the</text><text x="162" text-anchor="middle" y="165" font-size="17" fill="#f1f4fa">rows, and bring in the harvest.</text></g><g transform="translate(331.7,0)"><clipPath id="c0_1"><rect width="216.2" height="181" rx="10"/></clipPath><rect width="216.2" height="181" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="215.2" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="110" text-anchor="middle" y="39" font-size="17.5" font-style="italic" fill="#f1f4fa">That&#x27;s the science</text><text x="110" text-anchor="middle" y="64" font-size="17.5" font-style="italic" fill="#f1f4fa">fiction story I&#x27;m</text><text x="110" text-anchor="middle" y="89" font-size="17.5" font-style="italic" fill="#f1f4fa">building toward, and I</text><text x="110" text-anchor="middle" y="113" font-size="17.5" font-style="italic" fill="#f1f4fa">think we&#x27;re closer to</text><text x="110" text-anchor="middle" y="138" font-size="17.5" font-style="italic" fill="#f1f4fa">it than most people</text><text x="110" text-anchor="middle" y="163" font-size="17.5" font-style="italic" fill="#f1f4fa">realize.</text></g><g transform="translate(559.9,0)"><clipPath id="c0_2"><rect width="260.1" height="181" rx="10"/></clipPath><rect width="260.1" height="181" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="259.1" height="180" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="132" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#ffffff">🧩 Every repo on this</text><text x="132" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#ffffff">page is a piece of it.</text><text x="132" text-anchor="middle" y="93" font-size="17" fill="#f1f4fa">Right now I&#x27;m scraping the</text><text x="132" text-anchor="middle" y="117" font-size="17" fill="#f1f4fa">edges, but every piece</text><text x="132" text-anchor="middle" y="141" font-size="17" fill="#f1f4fa">works with the wifi off, and</text><text x="132" text-anchor="middle" y="165" font-size="17" fill="#f1f4fa">that&#x27;s on purpose.</text></g></g></svg>
