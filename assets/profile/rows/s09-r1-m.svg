<svg xmlns="http://www.w3.org/2000/svg" width="358" height="260" viewBox="0 0 358 260" role="img" aria-label="FiaOS. The Mac mini in a browser tab: live desktop, real PTY shell, voice. The bridge that gives the whole mesh free Claude. studio-record. Screen + facecam recorder with a local HTTP API, so Claude can record itself working."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#g)"/><rect width="4" height="125" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🌐 FiaOS</text><text x="19" y="65" font-size="16" fill="#eef2fa">The Mac mini in a browser tab: live</text><text x="19" y="87" font-size="16" fill="#eef2fa">desktop, real PTY shell, voice. The bridge</text><text x="19" y="110" font-size="16" fill="#eef2fa">that gives the whole mesh free Claude.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#g)"/><rect width="4" height="125" fill="#a7f0c2" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🎥 studio-record</text><text x="19" y="65" font-size="16" fill="#eef2fa">Screen + facecam recorder with a local</text><text x="19" y="87" font-size="16" fill="#eef2fa">HTTP API, so Claude can record itself</text><text x="19" y="110" font-size="16" fill="#eef2fa">working.</text></g></g></svg>
