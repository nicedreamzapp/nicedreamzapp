<svg xmlns="http://www.w3.org/2000/svg" width="358" height="260" viewBox="0 0 358 260" role="img" aria-label="FiaOS. The Mac mini in a browser tab: live desktop, real PTY shell, voice. The bridge that gives the whole mesh free Claude. studio-record. Screen + facecam recorder with a local HTTP API, so Claude can record itself working."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="#161b22"/><rect width="4" height="125" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🌐 FiaOS</text><text x="19" y="65" font-size="16" fill="#c9d1d9">The Mac mini in a browser tab: live</text><text x="19" y="87" font-size="16" fill="#c9d1d9">desktop, real PTY shell, voice. The bridge</text><text x="19" y="110" font-size="16" fill="#c9d1d9">that gives the whole mesh free Claude.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="#161b22"/><rect width="4" height="125" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🎥 studio-record</text><text x="19" y="65" font-size="16" fill="#c9d1d9">Screen + facecam recorder with a local</text><text x="19" y="87" font-size="16" fill="#c9d1d9">HTTP API, so Claude can record itself</text><text x="19" y="110" font-size="16" fill="#c9d1d9">working.</text></g></g></svg>
