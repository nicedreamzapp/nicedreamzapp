<svg xmlns="http://www.w3.org/2000/svg" width="358" height="260" viewBox="0 0 358 260" role="img" aria-label="FiaOS. The Mac mini in a browser tab: live desktop, real PTY shell, voice. The bridge that gives the whole mesh free Claude. studio-record. Screen + facecam recorder with a local HTTP API, so Claude can record itself working."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f7f"/><stop offset="1" stop-color="#9a5a6a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#caafc5">🌐 FiaOS</text><text x="181" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">The Mac mini in a browser tab: live</text><text x="181" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">desktop, real PTY shell, voice. The bridge</text><text x="181" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">that gives the whole mesh free Claude.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f7f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#caafc5">🎥 studio-record</text><text x="181" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">Screen + facecam recorder with a local</text><text x="181" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">HTTP API, so Claude can record itself</text><text x="181" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">working.</text></g></g></svg>
