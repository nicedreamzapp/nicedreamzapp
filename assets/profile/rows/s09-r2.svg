<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="claude-failover. One command and your claude -p agents keep running on a local MLX model when the cloud is down. story-forge. A whole film studio on one laptop. A director keeps going until every shot passes a local vision judge, then cuts, scores and voices the film. Two finished films, no cloud."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="324.6" height="133" rx="10"/></clipPath><rect width="324.6" height="133" rx="10" fill="#161b22"/><rect width="4" height="133" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="323.6" height="132" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🛟 claude-failover</text><text x="20" y="68" font-size="17" fill="#c9d1d9">One command and your claude -p</text><text x="20" y="93" font-size="17" fill="#c9d1d9">agents keep running on a local MLX</text><text x="20" y="117" font-size="17" fill="#c9d1d9">model when the cloud is down.</text></g><g transform="translate(336.6,0)"><clipPath id="c0_1"><rect width="483.4" height="133" rx="10"/></clipPath><rect width="483.4" height="133" rx="10" fill="#161b22"/><rect width="4" height="133" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="482.4" height="132" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🎬 story-forge</text><text x="20" y="68" font-size="17" fill="#c9d1d9">A whole film studio on one laptop. A director keeps going</text><text x="20" y="93" font-size="17" fill="#c9d1d9">until every shot passes a local vision judge, then cuts,</text><text x="20" y="117" font-size="17" fill="#c9d1d9">scores and voices the film. Two finished films, no cloud.</text></g></g></svg>
