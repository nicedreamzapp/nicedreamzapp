<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="claude-failover. One command and your claude -p agents keep running on a local MLX model when the cloud is down. story-forge. A whole film studio on one laptop. A director keeps going until every shot passes a local vision judge, then cuts, scores and voices the film. Two finished films, no cloud."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f7f"/><stop offset="1" stop-color="#9a5a6a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="324.6" height="133" rx="10"/></clipPath><rect width="324.6" height="133" rx="10" fill="url(#n)"/><rect width="324.6" height="4" fill="#8a4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="323.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="164" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🛟 claude-failover</text><text x="164" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">One command and your claude -p</text><text x="164" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">agents keep running on a local MLX</text><text x="164" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">model when the cloud is down.</text></g><g transform="translate(336.6,0)"><clipPath id="c0_1"><rect width="483.4" height="133" rx="10"/></clipPath><rect width="483.4" height="133" rx="10" fill="url(#n)"/><rect width="483.4" height="4" fill="#8a4f7f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="482.4" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="244" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🎬 story-forge</text><text x="244" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">A whole film studio on one laptop. A director keeps going</text><text x="244" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">until every shot passes a local vision judge, then cuts,</text><text x="244" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">scores and voices the film. Two finished films, no cloud.</text></g></g></svg>
