<svg xmlns="http://www.w3.org/2000/svg" width="560" height="157" viewBox="0 0 560 157" role="img" aria-label="That needed AI running on my own hardware instead of somebody else&#x27;s cloud. That became RealTime AI Cam: it names 601 objects, fully offline. Along the way it turned out to help blind people see, with no internet."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6a8f"/><stop offset="1" stop-color="#4f5f99"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="96" rx="10"/></clipPath><rect width="275.0" height="96" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="274.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="16" fill="#f1f4fa">💻 That needed AI running on my</text><text x="140" text-anchor="middle" y="58" font-size="16" fill="#f1f4fa">own hardware instead of</text><text x="140" text-anchor="middle" y="81" font-size="16" fill="#f1f4fa">somebody else&#x27;s cloud.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="96" rx="10"/></clipPath><rect width="275.0" height="96" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="274.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="36" font-size="16" fill="#f1f4fa">📷 That became RealTime AI</text><text x="140" text-anchor="middle" y="58" font-size="16" fill="#f1f4fa">Cam: it names 601 objects, fully</text><text x="140" text-anchor="middle" y="81" font-size="16" fill="#f1f4fa">offline.</text></g><g transform="translate(0.0,106)"><clipPath id="c1_0"><rect width="560.0" height="51" rx="10"/></clipPath><rect width="560.0" height="51" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="559.0" height="50" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="16" fill="#f1f4fa">🦯 Along the way it turned out to help blind people see, with no internet.</text></g></g></svg>
