<svg xmlns="http://www.w3.org/2000/svg" width="560" height="157" viewBox="0 0 560 157" role="img" aria-label="That needed AI running on my own hardware instead of somebody else&#x27;s cloud. That became RealTime AI Cam: it names 601 objects, fully offline. Along the way it turned out to help blind people see, with no internet."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="275.0" height="96" rx="10"/></clipPath><rect width="275.0" height="96" rx="10" fill="#161b22"/><rect width="4" height="96" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="274.0" height="95" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16" fill="#c9d1d9">💻 That needed AI running on my</text><text x="19" y="58" font-size="16" fill="#c9d1d9">own hardware instead of</text><text x="19" y="81" font-size="16" fill="#c9d1d9">somebody else&#x27;s cloud.</text></g><g transform="translate(285.0,0)"><clipPath id="c0_1"><rect width="275.0" height="96" rx="10"/></clipPath><rect width="275.0" height="96" rx="10" fill="#161b22"/><rect width="4" height="96" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.0" height="95" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16" fill="#c9d1d9">📷 That became RealTime AI</text><text x="19" y="58" font-size="16" fill="#c9d1d9">Cam: it names 601 objects, fully</text><text x="19" y="81" font-size="16" fill="#c9d1d9">offline.</text></g><g transform="translate(0.0,106)"><clipPath id="c1_0"><rect width="560.0" height="51" rx="10"/></clipPath><rect width="560.0" height="51" rx="10" fill="#161b22"/><rect width="4" height="51" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="50" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16" fill="#c9d1d9">🦯 Along the way it turned out to help blind people see, with no internet.</text></g></g></svg>
