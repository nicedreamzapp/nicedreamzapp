<svg xmlns="http://www.w3.org/2000/svg" width="820" height="184" viewBox="0 0 820 184" role="img" aria-label="Here&#x27;s where all of this is headed. You hand a robot a bag of seeds, show it where the hose is, and a few months later there are vegetables on the table. What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="341.6" height="184" rx="10"/></clipPath><rect width="341.6" height="184" rx="10" fill="#161b22"/><rect width="4" height="184" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="340.6" height="183" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🌱 Here&#x27;s where all of this is</text><text x="20" y="63" font-size="19" font-weight="700" fill="#e6edf3">headed.</text><text x="20" y="93" font-size="17.5" font-style="italic" fill="#c9d1d9">You hand a robot a bag of seeds,</text><text x="20" y="118" font-size="17.5" font-style="italic" fill="#c9d1d9">show it where the hose is, and a few</text><text x="20" y="143" font-size="17.5" font-style="italic" fill="#c9d1d9">months later there are vegetables</text><text x="20" y="168" font-size="17.5" font-style="italic" fill="#c9d1d9">on the table.</text></g><g transform="translate(353.6,0)"><clipPath id="c0_1"><rect width="217.7" height="184" rx="10"/></clipPath><rect width="217.7" height="184" rx="10" fill="#161b22"/><rect width="4" height="184" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="216.7" height="183" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🧺 What it does</text><text x="20" y="68" font-size="17" fill="#c9d1d9">It plants, waters,</text><text x="20" y="93" font-size="17" fill="#c9d1d9">weeds, harvests,</text><text x="20" y="117" font-size="17" fill="#c9d1d9">carries the food in, and</text><text x="20" y="141" font-size="17" fill="#c9d1d9">someday maybe cooks</text><text x="20" y="165" font-size="17" fill="#c9d1d9">it too.</text></g><g transform="translate(583.3,0)"><clipPath id="c0_2"><rect width="236.7" height="184" rx="10"/></clipPath><rect width="236.7" height="184" rx="10" fill="#161b22"/><rect width="4" height="184" fill="#6fbf8a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="235.7" height="183" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">☀️ No grid, no cloud</text><text x="20" y="68" font-size="17" fill="#c9d1d9">It charges from the sun</text><text x="20" y="93" font-size="17" fill="#c9d1d9">and its whole brain lives</text><text x="20" y="117" font-size="17" fill="#c9d1d9">inside it, so it keeps</text><text x="20" y="141" font-size="17" fill="#c9d1d9">working where there&#x27;s no</text><text x="20" y="165" font-size="17" fill="#c9d1d9">internet at all.</text></g></g></svg>
