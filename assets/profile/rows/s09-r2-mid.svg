<svg xmlns="http://www.w3.org/2000/svg" width="560" height="171" viewBox="0 0 560 171" role="img" aria-label="claude-failover. One command and your claude -p agents keep running on a local MLX model when the cloud is down. story-forge. A whole film studio on one laptop. A director keeps going until every shot passes a local vision judge, then cuts, scores and voices the film. Two finished films, no cloud."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="252.8" height="171" rx="10"/></clipPath><rect width="252.8" height="171" rx="10" fill="url(#g)"/><rect width="4" height="171" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="251.8" height="170" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🛟 claude-failover</text><text x="19" y="65" font-size="16" fill="#eef2fa">One command and your</text><text x="19" y="87" font-size="16" fill="#eef2fa">claude -p agents keep</text><text x="19" y="110" font-size="16" fill="#eef2fa">running on a local MLX</text><text x="19" y="133" font-size="16" fill="#eef2fa">model when the cloud is</text><text x="19" y="156" font-size="16" fill="#eef2fa">down.</text></g><g transform="translate(262.8,0)"><clipPath id="c0_1"><rect width="297.2" height="171" rx="10"/></clipPath><rect width="297.2" height="171" rx="10" fill="url(#g)"/><rect width="4" height="171" fill="#a7f0c2" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="296.2" height="170" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🎬 story-forge</text><text x="19" y="65" font-size="16" fill="#eef2fa">A whole film studio on one laptop.</text><text x="19" y="87" font-size="16" fill="#eef2fa">A director keeps going until every</text><text x="19" y="110" font-size="16" fill="#eef2fa">shot passes a local vision judge,</text><text x="19" y="133" font-size="16" fill="#eef2fa">then cuts, scores and voices the</text><text x="19" y="156" font-size="16" fill="#eef2fa">film. Two finished films, no cloud.</text></g></g></svg>
