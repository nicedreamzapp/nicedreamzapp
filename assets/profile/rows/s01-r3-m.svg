<svg xmlns="http://www.w3.org/2000/svg" width="358" height="210" viewBox="0 0 358 210" role="img" aria-label="Next: a robot that grows food. The bigger idea: robots that give people back what they have lost. Dozens of repos later I am somehow doing neuroscience, and every one of them still traces back to the coop."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="#161b22"/><rect width="4" height="102" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🌱 Next: a robot that grows food.</text><text x="19" y="65" font-size="16" fill="#c9d1d9">The bigger idea: robots that give people</text><text x="19" y="87" font-size="16" fill="#c9d1d9">back what they have lost.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="98" rx="10"/></clipPath><rect width="358.0" height="98" rx="10" fill="#161b22"/><rect width="4" height="98" fill="#d4a95a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="97" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16.5" font-style="italic" fill="#c9d1d9">Dozens of repos later I am somehow doing</text><text x="19" y="60" font-size="16.5" font-style="italic" fill="#c9d1d9">neuroscience, and every one of them still</text><text x="19" y="83" font-size="16.5" font-style="italic" fill="#c9d1d9">traces back to the coop.</text></g></g></svg>
