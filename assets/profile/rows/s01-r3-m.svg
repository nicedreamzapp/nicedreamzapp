<svg xmlns="http://www.w3.org/2000/svg" width="358" height="210" viewBox="0 0 358 210" role="img" aria-label="Next: a robot that grows food. The bigger idea: robots that give people back what they have lost. Dozens of repos later I am somehow doing neuroscience, and every one of them still traces back to the coop."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#g)"/><rect width="4" height="102" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🌱 Next: a robot that grows food.</text><text x="19" y="65" font-size="16" fill="#eef2fa">The bigger idea: robots that give people</text><text x="19" y="87" font-size="16" fill="#eef2fa">back what they have lost.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="98" rx="10"/></clipPath><rect width="358.0" height="98" rx="10" fill="url(#g)"/><rect width="4" height="98" fill="#ffd88a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="97" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="16.5" font-style="italic" fill="#eef2fa">Dozens of repos later I am somehow doing</text><text x="19" y="60" font-size="16.5" font-style="italic" fill="#eef2fa">neuroscience, and every one of them still</text><text x="19" y="83" font-size="16.5" font-style="italic" fill="#eef2fa">traces back to the coop.</text></g></g></svg>
