<svg xmlns="http://www.w3.org/2000/svg" width="820" height="214" viewBox="0 0 820 214" role="img" aria-label="THE SHOWCASE. AirGap AI. What a full private-AI build looks like for the kind of firm that cannot put its data into a cloud chatbot. It&#x27;s a capability I maintain, not a product I&#x27;m pushing. The three-node mesh is the demo: it&#x27;s been my daily driver for a year and a half. THE LONG ARC. The long arc is the robot. Same eyes, different bodies. Still figuring it out. No investors. One MacBook, one Mac mini, one VPS, and a lot of late nights."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="458.8" height="214" rx="10"/></clipPath><rect width="458.8" height="214" rx="10" fill="#161b22"/><rect width="4" height="214" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="457.8" height="213" rx="10" fill="none" stroke="#30363d"/><rect x="20" y="14" width="137" height="23" rx="11.5" fill="none" stroke="#6fbf8a"/><text x="88" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#6fbf8a" letter-spacing=".6">THE SHOWCASE</text><text x="20" y="71" font-size="19" font-weight="700" fill="#e6edf3">AirGap AI</text><text x="20" y="101" font-size="17" fill="#c9d1d9">What a full private-AI build looks like for the kind of</text><text x="20" y="126" font-size="17" fill="#c9d1d9">firm that cannot put its data into a cloud chatbot. It&#x27;s a</text><text x="20" y="150" font-size="17" fill="#c9d1d9">capability I maintain, not a product I&#x27;m pushing. The</text><text x="20" y="174" font-size="17" fill="#c9d1d9">three-node mesh is the demo: it&#x27;s been my daily</text><text x="20" y="198" font-size="17" fill="#c9d1d9">driver for a year and a half.</text></g><g transform="translate(470.8,0)"><clipPath id="c0_1"><rect width="162.4" height="214" rx="10"/></clipPath><rect width="162.4" height="214" rx="10" fill="#161b22"/><rect width="4" height="214" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="161.4" height="213" rx="10" fill="none" stroke="#30363d"/><rect x="20" y="14" width="128" height="23" rx="11.5" fill="none" stroke="#6fbf8a"/><text x="84" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#6fbf8a" letter-spacing=".6">THE LONG ARC</text><text x="20" y="71" font-size="19" font-weight="700" fill="#e6edf3">The long arc</text><text x="20" y="96" font-size="19" font-weight="700" fill="#e6edf3">is the robot.</text><text x="20" y="126" font-size="17" fill="#c9d1d9">Same eyes,</text><text x="20" y="150" font-size="17" fill="#c9d1d9">different bodies.</text></g><g transform="translate(645.3,0)"><clipPath id="c0_2"><rect width="174.7" height="214" rx="10"/></clipPath><rect width="174.7" height="214" rx="10" fill="#161b22"/><rect width="4" height="214" fill="#d4a95a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="173.7" height="213" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🌙 Still figuring</text><text x="20" y="63" font-size="19" font-weight="700" fill="#e6edf3">it out.</text><text x="20" y="93" font-size="17.5" font-style="italic" fill="#c9d1d9">No investors.</text><text x="20" y="118" font-size="17.5" font-style="italic" fill="#c9d1d9">One MacBook,</text><text x="20" y="143" font-size="17.5" font-style="italic" fill="#c9d1d9">one Mac mini,</text><text x="20" y="168" font-size="17.5" font-style="italic" fill="#c9d1d9">one VPS, and a</text><text x="20" y="193" font-size="17.5" font-style="italic" fill="#c9d1d9">lot of late nights.</text></g></g></svg>
