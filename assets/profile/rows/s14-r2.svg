<svg xmlns="http://www.w3.org/2000/svg" width="820" height="214" viewBox="0 0 820 214" role="img" aria-label="THE SHOWCASE. AirGap AI. What a full private-AI build looks like for the kind of firm that cannot put its data into a cloud chatbot. It&#x27;s a capability I maintain, not a product I&#x27;m pushing. The three-node mesh is the demo: it&#x27;s been my daily driver for a year and a half. THE LONG ARC. The long arc is the robot. Same eyes, different bodies. Still figuring it out. No investors. One MacBook, one Mac mini, one VPS, and a lot of late nights."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f4f7f"/><stop offset="1" stop-color="#8a4f5f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="458.8" height="214" rx="10"/></clipPath><rect width="458.8" height="214" rx="10" fill="url(#n)"/><rect width="458.8" height="4" fill="#6f4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="457.8" height="213" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="163" y="14" width="137" height="23" rx="11.5" fill="none" stroke="#fff3c4"/><text x="231" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#fff3c4" letter-spacing=".6">THE SHOWCASE</text><text x="231" text-anchor="middle" y="71" font-size="19" font-weight="700" fill="#beafc5">AirGap AI</text><text x="231" text-anchor="middle" y="101" font-size="17" fill="#d6dce6">What a full private-AI build looks like for the kind of</text><text x="231" text-anchor="middle" y="126" font-size="17" fill="#d6dce6">firm that cannot put its data into a cloud chatbot. It&#x27;s a</text><text x="231" text-anchor="middle" y="150" font-size="17" fill="#d6dce6">capability I maintain, not a product I&#x27;m pushing. The</text><text x="231" text-anchor="middle" y="174" font-size="17" fill="#d6dce6">three-node mesh is the demo: it&#x27;s been my daily</text><text x="231" text-anchor="middle" y="198" font-size="17" fill="#d6dce6">driver for a year and a half.</text></g><g transform="translate(470.8,0)"><clipPath id="c0_1"><rect width="162.4" height="214" rx="10"/></clipPath><rect width="162.4" height="214" rx="10" fill="url(#n)"/><rect width="162.4" height="4" fill="#6f4f7f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="161.4" height="213" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="19" y="14" width="128" height="23" rx="11.5" fill="none" stroke="#fff3c4"/><text x="83" y="30" text-anchor="middle" font-size="13" font-weight="700" fill="#fff3c4" letter-spacing=".6">THE LONG ARC</text><text x="83" text-anchor="middle" y="71" font-size="19" font-weight="700" fill="#beafc5">The long arc</text><text x="83" text-anchor="middle" y="96" font-size="19" font-weight="700" fill="#beafc5">is the robot.</text><text x="83" text-anchor="middle" y="126" font-size="17" fill="#d6dce6">Same eyes,</text><text x="83" text-anchor="middle" y="150" font-size="17" fill="#d6dce6">different bodies.</text></g><g transform="translate(645.3,0)"><clipPath id="c0_2"><rect width="174.7" height="214" rx="10"/></clipPath><rect width="174.7" height="214" rx="10" fill="url(#n)"/><rect width="174.7" height="4" fill="#6f4f7f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="173.7" height="213" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="89" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#beafc5">🌙 Still figuring</text><text x="89" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#beafc5">it out.</text><text x="89" text-anchor="middle" y="93" font-size="17.5" font-style="italic" fill="#d6dce6">No investors.</text><text x="89" text-anchor="middle" y="118" font-size="17.5" font-style="italic" fill="#d6dce6">One MacBook,</text><text x="89" text-anchor="middle" y="143" font-size="17.5" font-style="italic" fill="#d6dce6">one Mac mini,</text><text x="89" text-anchor="middle" y="168" font-size="17.5" font-style="italic" fill="#d6dce6">one VPS, and a</text><text x="89" text-anchor="middle" y="193" font-size="17.5" font-style="italic" fill="#d6dce6">lot of late nights.</text></g></g></svg>
