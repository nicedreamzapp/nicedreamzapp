me Space</text><text x="157" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Fly a real-physics starship through</text><text x="157" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">the solar system and 8,920 real stars.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="560.0" height="80" rx="10"/></clipPath><rect width="560.0" height="80" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a6a3a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ded5c7">🤖 Open source</text><text x="282" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Android source ships in each repo&#x27;s android/ folder.</text></g></g></svg>
