<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="FiaOS. The Mac mini in a browser tab: live desktop, real PTY shell, voice. The bridge that gives the whole mesh free Claude. studio-record. Screen + facecam recorder with a local HTTP API, so Claude can record itself working. claude-failover. One command and your claude -p agents keep running on a local MLX model when the cloud is down."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f7f"/><stop offset="1" stop-color="#9a5a6a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="280.4" height="157" rx="10"/></clipPath><rect width="280.4" height="157" rx="10" fill="url(#n)"/><rect width="280.4" height="4" fill="#8a4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="279.4" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="142" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#decddb">🌐 FiaOS</text><text x="142" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">The Mac mini in a browser tab:</text><text x="142" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">live desktop, real PTY shell,</text><text x="142" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">voice. The bridge that gives</text><text x="142" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">the whole mesh free Claude.</text></g><g transform="translate(292.4,0)"><clipPath id="c0_1"><rect width="235.1" height="157" rx="10"/></clipPath><rect width="235.1" height="157" rx="10" fill="url(#n)"/><rect width="2