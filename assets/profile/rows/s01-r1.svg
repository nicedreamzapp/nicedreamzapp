<svg xmlns="http://www.w3.org/2000/svg" width="820" height="127" viewBox="0 0 820 127" role="img" aria-label="Something was eating my chickens. That is the whole origin story. Protecting them needed a camera that could see at night. That needed a vision model small enough to live on a robot."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="372.8" height="127" rx="10"/></clipPath><rect width="372.8" height="127" rx="10" fill="url(#n)"/><rect width="372.8" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="371.8" height="126" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="188" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#c4dbd9">🐔 Something was eating my</text><text x="188" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#c4dbd9">chickens.</text><text x="188" text-anchor="middle" y="93" font-size="17.5" font-weight="500" font-style="italic" fill="#f2f5fa">That is the whole origin story.</text></g><g transform="translate(384.8,0)"><clipPath id="c0_1"><rect width="211.7" height="127" rx="10"/></clipPath><rect width="211.7" height="127" rx="10" fill="url(#n)"/><rect width="211.7" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="210.7" height="126" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="108" text-anchor="middle" y="38" font-size="17" font-weight="500" fill="#f2f5fa">🌙 Protecting them</text><text x="108" text-anchor="middle" y="62" font-size="17" font-weight="500" fill="#f2f5fa">needed a camera that</text><text x="108" text-anchor="middle" y="86" font-size="17" font-weight="500" fill="#f2f5fa">could see at night.</text></g><g transform="translate(608.4,0)"><clipPath id="c0_2"><rect width="211.6" height="127" rx="10"/></clipPath><rect width="211.6" height="127" rx="10" fill="url(#n)"/><rect width="211.6" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="210.6" height="126" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="108" text-anchor="middle" y="38" font-size="17" font-weight="500" fill="#f2f5fa">🤖 That needed a</text><text x="108" text-anchor="middle" y="62" font-size="17" font-weight="500" fill="#f2f5fa">vision model small</text><text x="108" text-anchor="middle" y="86" font-size="17" font-weight="500" fill="#f2f5fa">enough to live on a</text><text x="108" text-anchor="middle" y="111" font-size="17" font-weight="500" fill="#f2f5fa">robot.</text></g></g></svg>
