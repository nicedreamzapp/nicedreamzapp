<svg xmlns="http://www.w3.org/2000/svg" width="820" height="102" viewBox="0 0 820 102" role="img" aria-label="Protecting them needed a camera that could see at night. That needed a vision model small enough to live on a robot. That needed AI running on my own hardware instead of somebody else&#x27;s cloud."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="17" font-weight="500" fill="#f2f5fa">🌙 Protecting them needed a</text><text x="135" text-anchor="middle" y="62" font-size="17" font-weight="500" fill="#f2f5fa">camera that could see at</text><text x="135" text-anchor="middle" y="86" font-size="17" font-weight="500" fill="#f2f5fa">night.</text></g><g transform="translate(277.3,0)"><clipPath id="c0_1"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="17" font-weight="500" fill="#f2f5fa">🤖 That needed a vision</text><text x="135" text-anchor="middle" y="62" font-size="17" font-weight="500" fill="#f2f5fa">model small enough to live</text><text x="135" text-anchor="middle" y="86" font-size="17" font-weight="500" fill="#f2f5fa">on a robot.</text></g><g transform="translate(554.7,0)"><clipPath id="c0_2"><rect width="265.3" height="102" rx="10"/></clipPath><rect width="265.3" height="102" rx="10" fill="url(#n)"/><rect width="265.3" height="4" fill="#2f7f7a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="264.3" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="135" text-anchor="middle" y="38" font-size="17" font-weight="500" fill="#f2f5fa">💻 That needed AI running on</text><text x="135" text-anchor="middle" y="62" font-size="17" font-weight="500" fill="#f2f5fa">my own hardware instead of</text><text x="135" text-anchor="middle" y="86" font-size="17" font-weight="500" fill="#f2f5fa">somebody else&#x27;s cloud.</text></g></g></svg>
