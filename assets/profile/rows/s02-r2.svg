<svg xmlns="http://www.w3.org/2000/svg" width="820" height="254" viewBox="0 0 820 254" role="img" aria-label="claude-code-local. Claude Code running 100% on-device on Apple Silicon, with its own MLX server and tool-call parser. Featured in Awesome Claude Code, and fixes merged from contributors on hardware I don&#x27;t own. Upstream in Apple&#x27;s MLX. Muse Glimmer (Meta) text model support merged into ml-explore/mlx-lm (+302 lines). Thanks to @zcbenz for the review and merge. nemotron-omni-mlx. First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch reference."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="290.6" height="254" rx="10"/></clipPath><rect width="290.6" height="254" rx="10" fill="url(#g)"/><rect width="4" height="254" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="289.6" height="253" rx="10" fill="none" stroke="#7f93c9"/><text x="20" y="38" font-size="19" font-weight="700" fill="#ffffff">🧠 claude-code-local</text><text x="20" y="68" font-size="17" fill="#eef2fa">Claude Code running 100%</text><text x="20" y="93" font-size="17" fill="#eef2fa">on-device on Apple Silicon, with</text><text x="20" y="117" font-size="17" fill="#eef2fa">its own MLX server and tool-call</text><text x="20" y="141" font-size="17" fill="#eef2fa">parser. Featured in Awesome</text><text x="20" y="165" font-size="17" fill="#eef2fa">Claude Code, and fixes merged</text><text x="20" y="189" font-size="17" fill="#eef2fa">from contributors on hardware I</text><text x="20" y="213" font-size="17" fill="#eef2fa">don&#x27;t own.</text></g><g transform="translate(302.6,0)"><clipPath id="c0_1"><rect width="237.8" height="254" rx="10"/></clipPath><rect width="237.8" height="254" rx="10" fill="url(#g)"/><rect width="4" height="254" fill="#a7f0c2" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="236.8" height="253" rx="10" fill="none" stroke="#7f93c9"/><text x="20" y="38" font-size="19" font-weight="700" fill="#ffffff">🍎 Upstream in</text><text x="20" y="63" font-size="19" font-weight="700" fill="#ffffff">Apple&#x27;s MLX</text><text x="20" y="93" font-size="17" fill="#eef2fa">Muse Glimmer (Meta)</text><text x="20" y="117" font-size="17" fill="#eef2fa">text model support</text><text x="20" y="141" font-size="17" fill="#eef2fa">merged into</text><text x="20" y="165" font-size="17" fill="#eef2fa">ml-explore/mlx-lm (+302</text><text x="20" y="189" font-size="17" fill="#eef2fa">lines). Thanks to</text><text x="20" y="213" font-size="17" fill="#eef2fa">@zcbenz for the review</text><text x="20" y="238" font-size="17" fill="#eef2fa">and merge.</text></g><g transform="translate(552.4,0)"><clipPath id="c0_2"><rect width="267.6" height="254" rx="10"/></clipPath><rect width="267.6" height="254" rx="10" fill="url(#g)"/><rect width="4" height="254" fill="#a7f0c2" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="266.6" height="253" rx="10" fill="none" stroke="#7f93c9"/><text x="20" y="38" font-size="19" font-weight="700" fill="#ffffff">👁️ nemotron-omni-mlx</text><text x="20" y="68" font-size="17" fill="#eef2fa">First open Apple Silicon</text><text x="20" y="93" font-size="17" fill="#eef2fa">runtime for NVIDIA Nemotron</text><text x="20" y="117" font-size="17" fill="#eef2fa">Omni&#x27;s vision and audio</text><text x="20" y="141" font-size="17" fill="#eef2fa">towers, 23/23 parity tests</text><text x="20" y="165" font-size="17" fill="#eef2fa">against NVIDIA&#x27;s PyTorch</text><text x="20" y="189" font-size="17" fill="#eef2fa">reference.</text></g></g></svg>
