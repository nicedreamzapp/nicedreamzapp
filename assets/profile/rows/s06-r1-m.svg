<svg xmlns="http://www.w3.org/2000/svg" width="358" height="395" viewBox="0 0 358 395" role="img" aria-label="What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all. Now picture a village. Two of them, dropped where people are hungry and there&#x27;s no signal for a hundred miles."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7f5f"/><stop offset="1" stop-color="#6a7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">🧺 What it does</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">It plants, waters, weeds, harvests, carries</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">the food in, and someday maybe cooks it</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">too.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">☀️ No grid, no cloud</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">It charges from the sun and its whole brain</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">lives inside it, so it keeps working where</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">there&#x27;s no internet at all.</text></g><g transform="translate(0.0,270)"><clipPath id="c2_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">🏘️ Now picture a village</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Two of them, dropped where people are</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">hungry and there&#x27;s no signal for a hundred</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">miles.</text></g></g></svg>
