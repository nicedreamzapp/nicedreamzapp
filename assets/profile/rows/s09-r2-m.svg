<svg xmlns="http://www.w3.org/2000/svg" width="358" height="306" viewBox="0 0 358 306" role="img" aria-label="claude-failover. One command and your claude -p agents keep running on a local MLX model when the cloud is down. story-forge. A whole film studio on one laptop. A director keeps going until every shot passes a local vision judge, then cuts, scores and voices the film. Two finished films, no cloud."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f7f"/><stop offset="1" stop-color="#9a5a6a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decddb">🛟 claude-failover</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One command and your claude -p agents</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">keep running on a local MLX model when</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">the cloud is down.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="171" rx="10"/></clipPath><rect width="358.0" height="171" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f7f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decddb">🎬 story-forge</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">A whole film studio on one laptop. A</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">director keeps going until every shot</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">passes a local vision judge, then cuts,</text><text x="181" text-anchor="middle" y="133" font-size="16" font-weight="500" fill="#f2f5fa">scores and voices the film. Two finished</text><text x="181" text-anchor="middle" y="156" font-size="16" font-weight="500" fill="#f2f5fa">films, no cloud.</text></g></g></svg>
