<svg xmlns="http://www.w3.org/2000/svg" width="560" height="262" viewBox="0 0 560 262" role="img" aria-label="Here&#x27;s where all of this is headed. You hand a robot a bag of seeds, show it where the hose is, and a few months later there are vegetables on the table. What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="333.1" height="150" rx="10"/></clipPath><rect width="333.1" height="150" rx="10" fill="url(#g)"/><rect width="4" height="150" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="332.1" height="149" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🌱 Here&#x27;s where all of this is</text><text x="19" y="59" font-size="18" font-weight="700" fill="#ffffff">headed.</text><text x="19" y="89" font-size="16.5" font-style="italic" fill="#eef2fa">You hand a robot a bag of seeds, show</text><text x="19" y="112" font-size="16.5" font-style="italic" fill="#eef2fa">it where the hose is, and a few months</text><text x="19" y="135" font-size="16.5" font-style="italic" fill="#eef2fa">later there are vegetables on the table.</text></g><g transform="translate(343.1,0)"><clipPath id="c0_1"><rect width="216.9" height="150" rx="10"/></clipPath><rect width="216.9" height="150" rx="10" fill="url(#g)"/><rect width="4" height="150" fill="#a7f0c2" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="215.9" height="149" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🧺 What it does</text><text x="19" y="65" font-size="16" fill="#eef2fa">It plants, waters, weeds,</text><text x="19" y="87" font-size="16" fill="#eef2fa">harvests, carries the</text><text x="19" y="110" font-size="16" fill="#eef2fa">food in, and someday</text><text x="19" y="133" font-size="16" fill="#eef2fa">maybe cooks it too.</text></g><g transform="translate(0.0,160)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#g)"/><rect width="4" height="102" fill="#a7f0c2" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">☀️ No grid, no cloud</text><text x="19" y="65" font-size="16" fill="#eef2fa">It charges from the sun and its whole brain lives inside it, so it keeps</text><text x="19" y="87" font-size="16" fill="#eef2fa">working where there&#x27;s no internet at all.</text></g></g></svg>
