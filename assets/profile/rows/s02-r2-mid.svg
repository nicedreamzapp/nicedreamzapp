<svg xmlns="http://www.w3.org/2000/svg" width="560" height="329" viewBox="0 0 560 329" role="img" aria-label="claude-code-local. Claude Code running 100% on-device on Apple Silicon, with its own MLX server and tool-call parser. Featured in Awesome Claude Code, and fixes merged from contributors on hardware I don&#x27;t own. Upstream in Apple&#x27;s MLX. Muse Glimmer (Meta) text model support merged into ml-explore/mlx-lm (+302 lines). Thanks to @zcbenz for the review and merge. nemotron-omni-mlx. First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch reference."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="308.9" height="194" rx="10"/></clipPath><rect width="308.9" height="194" rx="10" fill="url(#n)"/><rect width="308.9" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="307.9" height="193" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="156" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#caafbb">🧠 claude-code-local</text><text x="156" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">Claude Code running 100%</text><text x="156" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">on-device on Apple Silicon, with its</text><text x="156" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">own MLX server and tool-call parser.</text><text x="156" text-anchor="middle" y="133" font-size="16" fill="#d6dce6">Featured in Awesome Claude Code,</text><text x="156" text-anchor="middle" y="156" font-size="16" fill="#d6dce6">and fixes merged from contributors</text><text x="156" text-anchor="middle" y="178" font-size="16" fill="#d6dce6">on hardware I don&#x27;t own.</text></g><g transform="translate(318.9,0)"><clipPath id="c0_1"><rect width="241.1" height="194" rx="10"/></clipPath><rect width="241.1" height="194" rx="10" fill="url(#n)"/><rect width="241.1" height="4" fill="#8a4f68" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="240.1" height="193" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="123" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#caafbb">🍎 Upstream in Apple&#x27;s</text><text x="123" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#caafbb">MLX</text><text x="123" text-anchor="middle" y="88" font-size="16" fill="#d6dce6">Muse Glimmer (Meta) text</text><text x="123" text-anchor="middle" y="111" font-size="16" fill="#d6dce6">model support merged into</text><text x="123" text-anchor="middle" y="133" font-size="16" fill="#d6dce6">ml-explore/mlx-lm (+302</text><text x="123" text-anchor="middle" y="156" font-size="16" fill="#d6dce6">lines). Thanks to @zcbenz</text><text x="123" text-anchor="middle" y="179" font-size="16" fill="#d6dce6">for the review and merge.</text></g><g transform="translate(0.0,204)"><clipPath id="c1_0"><rect width="560.0" height="125" rx="10"/></clipPath><rect width="560.0" height="125" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#8a4f68" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#caafbb">👁️ nemotron-omni-mlx</text><text x="282" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision</text><text x="282" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch</text><text x="282" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">reference.</text></g></g></svg>
