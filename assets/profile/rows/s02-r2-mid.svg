<svg xmlns="http://www.w3.org/2000/svg" width="560" height="329" viewBox="0 0 560 329" role="img" aria-label="claude-code-local. Claude Code running 100% on-device on Apple Silicon, with its own MLX server and tool-call parser. Featured in Awesome Claude Code, and fixes merged from contributors on hardware I don&#x27;t own. Upstream in Apple&#x27;s MLX. Muse Glimmer (Meta) text model support merged into ml-explore/mlx-lm (+302 lines). Thanks to @zcbenz for the review and merge. nemotron-omni-mlx. First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch reference."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="308.9" height="194" rx="10"/></clipPath><rect width="308.9" height="194" rx="10" fill="#161b22"/><rect width="4" height="194" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="307.9" height="193" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🧠 claude-code-local</text><text x="19" y="65" font-size="16" fill="#c9d1d9">Claude Code running 100%</text><text x="19" y="87" font-size="16" fill="#c9d1d9">on-device on Apple Silicon, with its</text><text x="19" y="110" font-size="16" fill="#c9d1d9">own MLX server and tool-call parser.</text><text x="19" y="133" font-size="16" fill="#c9d1d9">Featured in Awesome Claude Code,</text><text x="19" y="156" font-size="16" fill="#c9d1d9">and fixes merged from contributors</text><text x="19" y="178" font-size="16" fill="#c9d1d9">on hardware I don&#x27;t own.</text></g><g transform="translate(318.9,0)"><clipPath id="c0_1"><rect width="241.1" height="194" rx="10"/></clipPath><rect width="241.1" height="194" rx="10" fill="#161b22"/><rect width="4" height="194" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="240.1" height="193" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🍎 Upstream in Apple&#x27;s</text><text x="19" y="59" font-size="18" font-weight="700" fill="#e6edf3">MLX</text><text x="19" y="88" font-size="16" fill="#c9d1d9">Muse Glimmer (Meta) text</text><text x="19" y="111" font-size="16" fill="#c9d1d9">model support merged into</text><text x="19" y="133" font-size="16" fill="#c9d1d9">ml-explore/mlx-lm (+302</text><text x="19" y="156" font-size="16" fill="#c9d1d9">lines). Thanks to @zcbenz</text><text x="19" y="179" font-size="16" fill="#c9d1d9">for the review and merge.</text></g><g transform="translate(0.0,204)"><clipPath id="c1_0"><rect width="560.0" height="125" rx="10"/></clipPath><rect width="560.0" height="125" rx="10" fill="#161b22"/><rect width="4" height="125" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="124" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">👁️ nemotron-omni-mlx</text><text x="19" y="65" font-size="16" fill="#c9d1d9">First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision</text><text x="19" y="87" font-size="16" fill="#c9d1d9">and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch</text><text x="19" y="110" font-size="16" fill="#c9d1d9">reference.</text></g></g></svg>
