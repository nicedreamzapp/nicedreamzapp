<svg xmlns="http://www.w3.org/2000/svg" width="358" height="262" viewBox="0 0 358 262" role="img" aria-label="That needed AI running on my own hardware instead of somebody else&#x27;s cloud. That became RealTime AI Cam: it names 601 objects, fully offline. Along the way it turned out to help blind people see, with no internet."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f7f7a"/><stop offset="1" stop-color="#3f6f8a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="96" rx="10"/></clipPath><rect width="358.0" height="96" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="95" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="16" font-weight="500" fill="#f2f5fa">💻 That needed AI running on my own</text><text x="181" text-anchor="middle" y="58" font-size="16" font-weight="500" fill="#f2f5fa">hardware instead of somebody else&#x27;s</text><text x="181" text-anchor="middle" y="81" font-size="16" font-weight="500" fill="#f2f5fa">cloud.</text></g><g transform="translate(0.0,106)"><clipPath id="c1_0"><rect width="358.0" height="73" rx="10"/></clipPath><rect width="358.0" height="73" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="72" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="16" font-weight="500" fill="#f2f5fa">📷 That became RealTime AI Cam: it names</text><text x="181" text-anchor="middle" y="58" font-size="16" font-weight="500" fill="#f2f5fa">601 objects, fully offline.</text></g><g transform="translate(0.0,189)"><clipPath id="c2_0"><rect width="358.0" height="73" rx="10"/></clipPath><rect width="358.0" height="73" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#2f7f7a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="72" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="16" font-weight="500" fill="#f2f5fa">🦯 Along the way it turned out to help blind</text><text x="181" text-anchor="middle" y="58" font-size="16" font-weight="500" fill="#f2f5fa">people see, with no internet.</text></g></g></svg>
