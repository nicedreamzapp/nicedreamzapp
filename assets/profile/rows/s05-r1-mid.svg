<svg xmlns="http://www.w3.org/2000/svg" width="560" height="413" viewBox="0 0 560 413" role="img" aria-label="Trinidad Head. My own terminal, built from scratch for Windows and Mac. Glass windows with a neon glow. A different color for every open window. Your own questions easy to spot when you scroll back through an AI chat. nemotron-omni-mlx. NVIDIA&#x27;s Nemotron Omni sees, hears, and reasons. Its vision and audio towers had no open runtime for Apple Silicon. So I wrote one. Pure MLX, MIT. The numbers. 23/23 parity tests against NVIDIA&#x27;s PyTorch reference. 67.7 tok/s with an image, end to end. 110.5 tok/s with audio, end to end. On an M5 Max, wifi off."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="330.8" height="247" rx="10"/></clipPath><rect width="330.8" height="247" rx="10" fill="url(#n)"/><rect width="330.8" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="329.8" height="246" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="167" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#b4afcc">🖥️ Trinidad Head</text><text x="19" y="65" font-size="16" fill="#d6dce6">My own terminal, built from scratch for</text><text x="19" y="87" font-size="16" fill="#d6dce6">Windows and Mac.</text><text x="19" y="113" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="113" font-size="16" fill="#d6dce6">Glass windows with a neon glow</text><text x="19" y="138" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="138" font-size="16" fill="#d6dce6">A different color for every open</text><text x="31" y="161" font-size="16" fill="#d6dce6">window</text><text x="19" y="187" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="187" font-size="16" fill="#d6dce6">Your own questions easy to spot</text><text x="31" y="209" font-size="16" fill="#d6dce6">when you scroll back through an AI</text><text x="31" y="232" font-size="16" fill="#d6dce6">chat</text></g><g transform="translate(340.8,0)"><clipPath id="c0_1"><rect width="219.2" height="247" rx="10"/></clipPath><rect width="219.2" height="247" rx="10" fill="url(#n)"/><rect width="219.2" height="4" fill="#5a4f8f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="218.2" height="246" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="112" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#b4afcc">👁️</text><text x="112" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#b4afcc">nemotron-omni-mlx</text><text x="112" text-anchor="middle" y="88" font-size="16" fill="#d6dce6">NVIDIA&#x27;s Nemotron</text><text x="112" text-anchor="middle" y="111" font-size="16" fill="#d6dce6">Omni sees, hears, and</text><text x="112" text-anchor="middle" y="133" font-size="16" fill="#d6dce6">reasons. Its vision and</text><text x="112" text-anchor="middle" y="156" font-size="16" fill="#d6dce6">audio towers had no</text><text x="112" text-anchor="middle" y="179" font-size="16" fill="#d6dce6">open runtime for Apple</text><text x="112" text-anchor="middle" y="201" font-size="16" fill="#d6dce6">Silicon. So I wrote one.</text><text x="112" text-anchor="middle" y="227" font-size="14" font-weight="600" fill="#fff3c4">Pure MLX, MIT</text></g><g transform="translate(0.0,257)"><clipPath id="c1_0"><rect width="560.0" height="156" rx="10"/></clipPath><rect width="560.0" height="156" rx="10" fill="url(#n)"/><rect width="560.0" height="4" fill="#5a4f8f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="155" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#b4afcc">⚡ The numbers</text><text x="19" y="65" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="65" font-size="16" fill="#d6dce6">23/23 parity tests against NVIDIA&#x27;s PyTorch reference</text><text x="19" y="90" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="90" font-size="16" fill="#d6dce6">67.7 tok/s with an image, end to end</text><text x="19" y="116" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="116" font-size="16" fill="#d6dce6">110.5 tok/s with audio, end to end</text><text x="19" y="141" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="141" font-size="16" fill="#d6dce6">On an M5 Max, wifi off</text></g></g></svg>
