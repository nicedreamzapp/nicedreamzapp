<svg xmlns="http://www.w3.org/2000/svg" width="560" height="413" viewBox="0 0 560 413" role="img" aria-label="Trinidad Head. My own terminal, built from scratch for Windows and Mac. Glass windows with a neon glow. A different color for every open window. Your own questions easy to spot when you scroll back through an AI chat. nemotron-omni-mlx. NVIDIA&#x27;s Nemotron Omni sees, hears, and reasons. Its vision and audio towers had no open runtime for Apple Silicon. So I wrote one. Pure MLX, MIT. The numbers. 23/23 parity tests against NVIDIA&#x27;s PyTorch reference. 67.7 tok/s with an image, end to end. 110.5 tok/s with audio, end to end. On an M5 Max, wifi off."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="330.8" height="247" rx="10"/></clipPath><rect width="330.8" height="247" rx="10" fill="#161b22"/><rect width="4" height="247" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="329.8" height="246" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🖥️ Trinidad Head</text><text x="19" y="65" font-size="16" fill="#c9d1d9">My own terminal, built from scratch for</text><text x="19" y="87" font-size="16" fill="#c9d1d9">Windows and Mac.</text><text x="19" y="113" font-size="16" font-weight="800" fill="#6fbf8a">•</text><text x="31" y="113" font-size="16" fill="#c9d1d9">Glass windows with a neon glow</text><text x="19" y="138" font-size="16" font-weight="800" fill="#6fbf8a">•</text><text x="31" y="138" font-size="16" fill="#c9d1d9">A different color for every open</text><text x="31" y="161" font-size="16" fill="#c9d1d9">window</text><text x="19" y="187" font-size="16" font-weight="800" fill="#6fbf8a">•</text><text x="31" y="187" font-size="16" fill="#c9d1d9">Your own questions easy to spot</text><text x="31" y="209" font-size="16" fill="#c9d1d9">when you scroll back through an AI</text><text x="31" y="232" font-size="16" fill="#c9d1d9">chat</text></g><g transform="translate(340.8,0)"><clipPath id="c0_1"><rect width="219.2" height="247" rx="10"/></clipPath><rect width="219.2" height="247" rx="10" fill="#161b22"/><rect width="4" height="247" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="218.2" height="246" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">👁️</text><text x="19" y="59" font-size="18" font-weight="700" fill="#e6edf3">nemotron-omni-mlx</text><text x="19" y="88" font-size="16" fill="#c9d1d9">NVIDIA&#x27;s Nemotron</text><text x="19" y="111" font-size="16" fill="#c9d1d9">Omni sees, hears, and</text><text x="19" y="133" font-size="16" fill="#c9d1d9">reasons. Its vision and</text><text x="19" y="156" font-size="16" fill="#c9d1d9">audio towers had no</text><text x="19" y="179" font-size="16" fill="#c9d1d9">open runtime for Apple</text><text x="19" y="201" font-size="16" fill="#c9d1d9">Silicon. So I wrote one.</text><text x="19" y="227" font-size="14" font-weight="600" fill="#6fbf8a">Pure MLX, MIT</text></g><g transform="translate(0.0,257)"><clipPath id="c1_0"><rect width="560.0" height="156" rx="10"/></clipPath><rect width="560.0" height="156" rx="10" fill="#161b22"/><rect width="4" height="156" fill="#d4a95a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="155" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">⚡ The numbers</text><text x="19" y="65" font-size="16" font-weight="800" fill="#d4a95a">•</text><text x="31" y="65" font-size="16" fill="#c9d1d9">23/23 parity tests against NVIDIA&#x27;s PyTorch reference</text><text x="19" y="90" font-size="16" font-weight="800" fill="#d4a95a">•</text><text x="31" y="90" font-size="16" fill="#c9d1d9">67.7 tok/s with an image, end to end</text><text x="19" y="116" font-size="16" font-weight="800" fill="#d4a95a">•</text><text x="31" y="116" font-size="16" fill="#c9d1d9">110.5 tok/s with audio, end to end</text><text x="19" y="141" font-size="16" font-weight="800" fill="#d4a95a">•</text><text x="31" y="141" font-size="16" fill="#c9d1d9">On an M5 Max, wifi off</text></g></g></svg>
