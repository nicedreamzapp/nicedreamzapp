<svg xmlns="http://www.w3.org/2000/svg" width="358" height="461" viewBox="0 0 358 461" role="img" aria-label="THE SHOWCASE. AirGap AI. What a full private-AI build looks like for the kind of firm that cannot put its data into a cloud chatbot. It&#x27;s a capability I maintain, not a product I&#x27;m pushing. The three-node mesh is the demo: it&#x27;s been my daily driver for a year and a half. THE LONG ARC. The long arc is the robot. Same eyes, different bodies. Still figuring it out. No investors. One MacBook, one Mac mini, one VPS, and a lot of late nights."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="225" rx="10"/></clipPath><rect width="358.0" height="225" rx="10" fill="url(#g)"/><rect width="4" height="225" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="224" rx="10" fill="none" stroke="#7f93c9"/><rect x="19" y="13" width="128" height="22" rx="11.0" fill="none" stroke="#a7f0c2"/><text x="83" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#a7f0c2" letter-spacing=".6">THE SHOWCASE</text><text x="19" y="68" font-size="18" font-weight="700" fill="#ffffff">AirGap AI</text><text x="19" y="97" font-size="16" fill="#eef2fa">What a full private-AI build looks like for the</text><text x="19" y="119" font-size="16" fill="#eef2fa">kind of firm that cannot put its data into a</text><text x="19" y="142" font-size="16" fill="#eef2fa">cloud chatbot. It&#x27;s a capability I maintain,</text><text x="19" y="165" font-size="16" fill="#eef2fa">not a product I&#x27;m pushing. The three-node</text><text x="19" y="188" font-size="16" fill="#eef2fa">mesh is the demo: it&#x27;s been my daily driver</text><text x="19" y="210" font-size="16" fill="#eef2fa">for a year and a half.</text></g><g transform="translate(0.0,235)"><clipPath id="c1_0"><rect width="358.0" height="112" rx="10"/></clipPath><rect width="358.0" height="112" rx="10" fill="url(#g)"/><rect width="4" height="112" fill="#a7f0c2" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="111" rx="10" fill="none" stroke="#7f93c9"/><rect x="19" y="13" width="120" height="22" rx="11.0" fill="none" stroke="#a7f0c2"/><text x="79" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#a7f0c2" letter-spacing=".6">THE LONG ARC</text><text x="19" y="68" font-size="18" font-weight="700" fill="#ffffff">The long arc is the robot.</text><text x="19" y="97" font-size="16" fill="#eef2fa">Same eyes, different bodies.</text></g><g transform="translate(0.0,357)"><clipPath id="c2_0"><rect width="358.0" height="104" rx="10"/></clipPath><rect width="358.0" height="104" rx="10" fill="url(#g)"/><rect width="4" height="104" fill="#ffd88a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="103" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🌙 Still figuring it out.</text><text x="19" y="65" font-size="16.5" font-style="italic" fill="#eef2fa">No investors. One MacBook, one Mac mini,</text><text x="19" y="89" font-size="16.5" font-style="italic" fill="#eef2fa">one VPS, and a lot of late nights.</text></g></g></svg>
