<svg xmlns="http://www.w3.org/2000/svg" width="358" height="461" viewBox="0 0 358 461" role="img" aria-label="THE SHOWCASE. AirGap AI. What a full private-AI build looks like for the kind of firm that cannot put its data into a cloud chatbot. It&#x27;s a capability I maintain, not a product I&#x27;m pushing. The three-node mesh is the demo: it&#x27;s been my daily driver for a year and a half. THE LONG ARC. The long arc is the robot. Same eyes, different bodies. Still figuring it out. No investors. One MacBook, one Mac mini, one VPS, and a lot of late nights."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f4f7f"/><stop offset="1" stop-color="#8a4f5f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="225" rx="10"/></clipPath><rect width="358.0" height="225" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#6f4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="224" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="117" y="13" width="128" height="22" rx="11.0" fill="none" stroke="#fff3c4"/><text x="181" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff3c4" letter-spacing=".6">THE SHOWCASE</text><text x="181" text-anchor="middle" y="68" font-size="18" font-weight="700" fill="#beafc5">AirGap AI</text><text x="181" text-anchor="middle" y="97" font-size="16" fill="#d6dce6">What a full private-AI build looks like for the</text><text x="181" text-anchor="middle" y="119" font-size="16" fill="#d6dce6">kind of firm that cannot put its data into a</text><text x="181" text-anchor="middle" y="142" font-size="16" fill="#d6dce6">cloud chatbot. It&#x27;s a capability I maintain,</text><text x="181" text-anchor="middle" y="165" font-size="16" fill="#d6dce6">not a product I&#x27;m pushing. The three-node</text><text x="181" text-anchor="middle" y="188" font-size="16" fill="#d6dce6">mesh is the demo: it&#x27;s been my daily driver</text><text x="181" text-anchor="middle" y="210" font-size="16" fill="#d6dce6">for a year and a half.</text></g><g transform="translate(0.0,235)"><clipPath id="c1_0"><rect width="358.0" height="112" rx="10"/></clipPath><rect width="358.0" height="112" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#6f4f7f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="111" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="121" y="13" width="120" height="22" rx="11.0" fill="none" stroke="#fff3c4"/><text x="181" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff3c4" letter-spacing=".6">THE LONG ARC</text><text x="181" text-anchor="middle" y="68" font-size="18" font-weight="700" fill="#beafc5">The long arc is the robot.</text><text x="181" text-anchor="middle" y="97" font-size="16" fill="#d6dce6">Same eyes, different bodies.</text></g><g transform="translate(0.0,357)"><clipPath id="c2_0"><rect width="358.0" height="104" rx="10"/></clipPath><rect width="358.0" height="104" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#6f4f7f" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="103" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#beafc5">🌙 Still figuring it out.</text><text x="181" text-anchor="middle" y="65" font-size="16.5" font-style="italic" fill="#d6dce6">No investors. One MacBook, one Mac mini,</text><text x="181" text-anchor="middle" y="89" font-size="16.5" font-style="italic" fill="#d6dce6">one VPS, and a lot of late nights.</text></g></g></svg>
