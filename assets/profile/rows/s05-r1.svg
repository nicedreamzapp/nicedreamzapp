<svg xmlns="http://www.w3.org/2000/svg" width="820" height="262" viewBox="0 0 820 262" role="img" aria-label="Trinidad Head. My own terminal, built from scratch for Windows and Mac. Glass windows with a neon glow. A different color for every open window. Your own questions easy to spot when you scroll back through an AI chat. nemotron-omni-mlx. NVIDIA&#x27;s Nemotron Omni sees, hears, and reasons. Its vision and audio towers had no open runtime for Apple Silicon. So I wrote one. Pure MLX, MIT. The numbers. 23/23 parity tests against NVIDIA&#x27;s PyTorch reference. 67.7 tok/s with an image, end to end. 110.5 tok/s with audio, end to end. On an M5 Max, wifi off."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="312.4" height="262" rx="10"/></clipPath><rect width="312.4" height="262" rx="10" fill="#161b22"/><rect width="4" height="262" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="311.4" height="261" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🖥️ Trinidad Head</text><text x="20" y="68" font-size="17" fill="#c9d1d9">My own terminal, built from</text><text x="20" y="93" font-size="17" fill="#c9d1d9">scratch for Windows and Mac.</text><text x="20" y="120" font-size="17" font-weight="800" fill="#6fbf8a">•</text><text x="33" y="120" font-size="17" fill="#c9d1d9">Glass windows with a neon glow</text><text x="20" y="147" font-size="17" font-weight="800" fill="#6fbf8a">•</text><text x="33" y="147" font-size="17" fill="#c9d1d9">A different color for every open</text><text x="33" y="171" font-size="17" fill="#c9d1d9">window</text><text x="20" y="198" font-size="17" font-weight="800" fill="#6fbf8a">•</text><text x="33" y="198" font-size="17" fill="#c9d1d9">Your own questions easy to spot</text><text x="33" y="222" font-size="17" fill="#c9d1d9">when you scroll back through an</text><text x="33" y="246" font-size="17" fill="#c9d1d9">AI chat</text></g><g transform="translate(324.4,0)"><clipPath id="c0_1"><rect width="227.5" height="262" rx="10"/></clipPath><rect width="227.5" height="262" rx="10" fill="#161b22"/><rect width="4" height="262" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="226.5" height="261" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">👁️</text><text x="20" y="63" font-size="19" font-weight="700" fill="#e6edf3">nemotron-omni-mlx</text><text x="20" y="93" font-size="17" fill="#c9d1d9">NVIDIA&#x27;s Nemotron</text><text x="20" y="117" font-size="17" fill="#c9d1d9">Omni sees, hears, and</text><text x="20" y="141" font-size="17" fill="#c9d1d9">reasons. Its vision and</text><text x="20" y="165" font-size="17" fill="#c9d1d9">audio towers had no</text><text x="20" y="189" font-size="17" fill="#c9d1d9">open runtime for Apple</text><text x="20" y="213" font-size="17" fill="#c9d1d9">Silicon. So I wrote one.</text><text x="20" y="240" font-size="15" font-weight="600" fill="#6fbf8a">Pure MLX, MIT</text></g><g transform="translate(563.9,0)"><clipPath id="c0_2"><rect width="256.1" height="262" rx="10"/></clipPath><rect width="256.1" height="262" rx="10" fill="#161b22"/><rect width="4" height="262" fill="#d4a95a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="255.1" height="261" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">⚡ The numbers</text><text x="20" y="68" font-size="17" font-weight="800" fill="#d4a95a">•</text><text x="33" y="68" font-size="17" fill="#c9d1d9">23/23 parity tests against</text><text x="33" y="93" font-size="17" fill="#c9d1d9">NVIDIA&#x27;s PyTorch</text><text x="33" y="117" font-size="17" fill="#c9d1d9">reference</text><text x="20" y="144" font-size="17" font-weight="800" fill="#d4a95a">•</text><text x="33" y="144" font-size="17" fill="#c9d1d9">67.7 tok/s with an image,</text><text x="33" y="168" font-size="17" fill="#c9d1d9">end to end</text><text x="20" y="195" font-size="17" font-weight="800" fill="#d4a95a">•</text><text x="33" y="195" font-size="17" fill="#c9d1d9">110.5 tok/s with audio,</text><text x="33" y="219" font-size="17" fill="#c9d1d9">end to end</text><text x="20" y="246" font-size="17" font-weight="800" fill="#d4a95a">•</text><text x="33" y="246" font-size="17" fill="#c9d1d9">On an M5 Max, wifi off</text></g></g></svg>
