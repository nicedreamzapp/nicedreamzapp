<svg xmlns="http://www.w3.org/2000/svg" width="820" height="262" viewBox="0 0 820 262" role="img" aria-label="Trinidad Head. My own terminal, built from scratch for Windows and Mac. Glass windows with a neon glow. A different color for every open window. Your own questions easy to spot when you scroll back through an AI chat. nemotron-omni-mlx. NVIDIA&#x27;s Nemotron Omni sees, hears, and reasons. Its vision and audio towers had no open runtime for Apple Silicon. So I wrote one. Pure MLX, MIT. The numbers. 23/23 parity tests against NVIDIA&#x27;s PyTorch reference. 67.7 tok/s with an image, end to end. 110.5 tok/s with audio, end to end. On an M5 Max, wifi off."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="312.4" height="262" rx="10"/></clipPath><rect width="312.4" height="262" rx="10" fill="url(#n)"/><rect width="312.4" height="4" fill="#5a4f8f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="311.4" height="261" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="158" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#d0cddf">🖥️ Trinidad Head</text><text x="20" y="68" font-size="17" font-weight="500" fill="#f2f5fa">My own terminal, built from</text><text x="20" y="93" font-size="17" font-weight="500" fill="#f2f5fa">scratch for Windows and Mac.</text><text x="20" y="120" font-size="17" font-weight="800" fill="#fff3c4">•</text><text x="33" y="120" font-size="17" font-weight="500" fill="#f2f5fa">Glass windows with a neon glow</text><text x="20" y="147" font-size="17" font-weight="800" fill="#fff3c4"