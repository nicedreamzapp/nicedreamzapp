<svg xmlns="http://www.w3.org/2000/svg" width="560" height="374" viewBox="0 0 560 374" role="img" aria-label="Claude Code Local. Run Claude Code on your own machine: Mac (MLX), Linux and Windows (llama.cpp). Hit your limit, type exit, then keep going on a local model. Setup picks the model for your memory, from Qwen 3.5 2B on an 8 GB Mac to Qwen 3.8 27B on 96 GB. Featured in Awesome Claude Code, with fixes merged from contributors on hardware I don&#x27;t own. Browser Broker. One logged-in browser, many agents, nobody fights. Each agent gets its own background tab with your real logins. About 300 lines, one dependency. Agent-12. A filesystem-judged local agent leaderboard, independently reproduced by @galashko."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f6f3a"/><stop offset="1" stop-color="#5f7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="351.5" height="262" rx="10"/></clipPath><rect width="351.5" height="262" rx="10" fill="url(#n)"/><rect width="351.5" height="4" fill="#7f6f3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="350.5" height="261" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="178" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#dbd6c7">🧠 Claude Code Local</text><text x="178" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Run Claude Code on your own machine:</text><text x="178" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">Mac (MLX), Linux and Windows</text><text x="178" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">(llama.cpp). Hit your limit, type exit, then</text><t