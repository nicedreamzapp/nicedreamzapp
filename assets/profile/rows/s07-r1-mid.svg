<svg xmlns="http://www.w3.org/2000/svg" width="560" height="150" viewBox="0 0 560 150" role="img" aria-label="AirGap is my name for the full private-AI build. A complete AI workstation on one Mac, wifi off, nothing leaving the building. A capability I keep sharp. It started as a packaged offering; these days I treat it as a capability I keep sharp rather than something I sell."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="267.5" height="150" rx="10"/></clipPath><rect width="267.5" height="150" rx="10" fill="#161b22"/><rect width="4" height="150" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="266.5" height="149" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🔒 AirGap is my name for</text><text x="19" y="59" font-size="18" font-weight="700" fill="#e6edf3">the full private-AI build.</text><text x="19" y="89" font-size="16.5" font-style="italic" fill="#c9d1d9">A complete AI workstation on</text><text x="19" y="112" font-size="16.5" font-style="italic" fill="#c9d1d9">one Mac, wifi off, nothing</text><text x="19" y="135" font-size="16.5" font-style="italic" fill="#c9d1d9">leaving the building.</text></g><g transform="translate(277.5,0)"><clipPath id="c0_1"><rect width="282.5" height="150" rx="10"/></clipPath><rect width="282.5" height="150" rx="10" fill="#161b22"/><rect width="4" height="150" fill="#6fbf8a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="281.5" height="149" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🧰 A capability I keep sharp</text><text x="19" y="65" font-size="16" fill="#c9d1d9">It started as a packaged offering;</text><text x="19" y="87" font-size="16" fill="#c9d1d9">these days I treat it as a</text><text x="19" y="110" font-size="16" fill="#c9d1d9">capability I keep sharp rather</text><text x="19" y="13