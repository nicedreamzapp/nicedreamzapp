<svg xmlns="http://www.w3.org/2000/svg" width="358" height="270" viewBox="0 0 358 270" role="img" aria-label="Something was eating my chickens. That is the whole origin story. Protecting them needed a camera that could see at night. That needed a vision model small enough to live on a robot."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="104" rx="10"/></clipPath><rect width="358.0" height="104" rx="10" fill="#161b22"/><rect width="4" height="104" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="103" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🐔 Something was eating my</text><text x="19" y="59" font-size="18" font-weight="700" fill="#e6edf3">chickens.</text><text x="19" y="89" font-size="16.5" font-style="italic" fill="#c9d1d9">That is the whole origin story.</text></g><g transform="translate(0.0,114)"><clipPath id="c1_0"><rect width="358.0" height="73" rx="10"/></clipPath><rect width="358.0" height="73" rx="10" fill="#161b22"/><rect width="4" height="73" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="72" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16" fill="#c9d1d9">🌙 Protecting them needed a camera that</text><text x="19" y="58" font-size="16" fill="#c9d1d9">could see at night.</text></g><g transform="translate(0.0,197)"><clipPath id="c2_0"><rect width="358.0" height="73" rx="10"/></clipPath><rect width="358.0" height="73" rx="10" fill="#161b22"/><rect width="4" height="73" fill="#6fbf8a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="72" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="16" fill="#c9d1d9">🤖 That needed a vision model small</text><text x="19" y="58" font-size="16" fill="#c9d1d9">enough to live on a robot.</text></g></g></svg>
