<svg xmlns="http://www.w3.org/2000/svg" width="560" height="329" viewBox="0 0 560 329" role="img" aria-label="Claude Code Local. Run Claude Code 100% on-device on Apple Silicon. Current lineup led by Qwen 3.8 27B and Gemma 4 31B, four modes (code, browser, voice, phone), Anthropic-compatible MLX server, setup.sh picks the right model for your RAM. Your code never leaves your Mac. Featured in Awesome Claude Code. MLX · Apple Silicon · Claude Code · Python. Browser Broker. One logged-in browser, many agents, nobody fights. Leases each agent an ordinary background tab in your real browser, with your real logins, and every agent sees only its own. ~300 lines, one dependency. Verified on Linux by a stranger who then found a bug in my own docs. Chrome DevTools Protocol · Multi-agent · Local AI."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="295.1" height="329" rx="10"/></clipPath><rect width="295.1" height="329" rx="10" fill="url(#g)"/><rect width="4" height="329" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="294.1" height="328" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🧠 Claude Code Local</text><text x="19" y="65" font-size="16" fill="#eef2fa">Run Claude Code 100% on-device</text><text x="19" y="87" font-size="16" fill="#eef2fa">on Apple Silicon. Current lineup</text><text x="19" y="110" font-size="16" fill="#eef2fa">led by Qwen 3.8 27B and Gemma</text><text x="19" y="133" font-size="16" fill="#eef2fa">4 31B, four modes (code, browser,</text><text x="19" y="156" font-size="16" fill="#eef2fa">voice, phone),</text><text x="19" y="178" font-size="16" fill="#eef2fa">Anthropic-compatible MLX server,</text><text x="19" y="201" font-s