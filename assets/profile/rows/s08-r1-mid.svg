<svg xmlns="http://www.w3.org/2000/svg" width="560" height="329" viewBox="0 0 560 329" role="img" aria-label="Claude Code Local. Run Claude Code 100% on-device on Apple Silicon. Current lineup led by Qwen 3.8 27B and Gemma 4 31B, four modes (code, browser, voice, phone), Anthropic-compatible MLX server, setup.sh picks the right model for your RAM. Your code never leaves your Mac. Featured in Awesome Claude Code. MLX · Apple Silicon · Claude Code · Python. Browser Broker. One logged-in browser, many agents, nobody fights. Leases each agent an ordinary background tab in your real browser, with your real logins, and every agent sees only its own. ~300 lines, one dependency. Verified on Linux by a stranger who then found a bug in my own docs. Chrome DevTools Protocol · Multi-agent · Local AI."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="295.1" height="329" rx="10"/></clipPath><rect width="295.1" height="329" rx="10" fill="#161b22"/><rect width="4" height="329" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="294.1" height="328" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🧠 Claude Code Local</text><text x="19" y="65" font-size="16" fill="#c9d1d9">Run Claude Code 100% on-device</text><text x="19" y="87" font-size="16" fill="#c9d1d9">on Apple Silicon. Current lineup</text><text x="19" y="110" font-size="16" fill="#c9d1d9">led by Qwen 3.8 27B and Gemma</text><text x="19" y="133" font-size="16" fill="#c9d1d9">4 31B, four modes (code, browser,</text><text x="19" y="156" font-size="16" fill="#c9d1d9">voice, phone),</text><text x="19" y="178" font-size="16" fill="#c9d1d9">Anthropic-compatible MLX server,</text><text x="19" y="201" font-size="16" fill="#c9d1d9">setup.sh picks the right model for</text><text x="19" y="224" font-size="16" fill="#c9d1d9">your RAM. Your code never leaves</text><tex