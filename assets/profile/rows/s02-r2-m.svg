<svg xmlns="http://www.w3.org/2000/svg" width="358" height="487" viewBox="0 0 358 487" role="img" aria-label="claude-code-local. Claude Code running 100% on-device on Apple Silicon, with its own MLX server and tool-call parser. Featured in Awesome Claude Code, and fixes merged from contributors on hardware I don&#x27;t own. Upstream in Apple&#x27;s MLX. Muse Glimmer (Meta) text model support merged into ml-explore/mlx-lm (+302 lines). Thanks to @zcbenz for the review and merge. nemotron-omni-mlx. First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch reference."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4f68"/><stop offset="1" stop-color="#6f4f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="171" rx="10"/></clipPath><rect width="358.0" height="171" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#8a4f68" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="170" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#decdd4">🧠 claude-code-local</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Claude Code running 100% on-device on</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">Apple Silicon, with its own MLX server and</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">tool-call parser. Featured in Awesome</text><text x="181" text-anchor="middle" y="133" font-size="16" font-