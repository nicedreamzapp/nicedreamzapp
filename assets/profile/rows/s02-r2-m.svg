<svg xmlns="http://www.w3.org/2000/svg" width="358" height="487" viewBox="0 0 358 487" role="img" aria-label="claude-code-local. Claude Code running 100% on-device on Apple Silicon, with its own MLX server and tool-call parser. Featured in Awesome Claude Code, and fixes merged from contributors on hardware I don&#x27;t own. Upstream in Apple&#x27;s MLX. Muse Glimmer (Meta) text model support merged into ml-explore/mlx-lm (+302 lines). Thanks to @zcbenz for the review and merge. nemotron-omni-mlx. First open Apple Silicon runtime for NVIDIA Nemotron Omni&#x27;s vision and audio towers, 23/23 parity tests against NVIDIA&#x27;s PyTorch reference."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="171" rx="10"/></clipPath><rect width="358.0" height="171" rx="10" fill="#161b22"/><rect width="4" height="171" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="170" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🧠 claude-code-local</text><text x="19" y="65" font-size="16" fill="#c9d1d9">Claude Code running 100% on-device on</text><text x="19" y="87" font-size="16" fill="#c9d1d9">Apple Silicon, with its own MLX server and</text><text x="19" y="110" font-size="16" fill="#c9d1d9">tool-call parser. Featured in Awesome</text><text x="19" y="133" font-size="16" fill="#c9d1d9">Claude Code, and fixes merged from</text><text x="19" y="156" font-size="16" fill="#c9d1d9">contributors on hardware I don&#x27;t own.</text></g><g transform="translate(0.0,181)"><clipPath id="c1_0"><rect width="358.0" height="148" rx="10"/></clipPath><rect width="358.0" height="148" rx="10" fill="#161b22"/><rect width="4" height="148" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="147" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="7