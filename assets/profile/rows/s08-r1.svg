<svg xmlns="http://www.w3.org/2000/svg" width="820" height="256" viewBox="0 0 820 256" role="img" aria-label="Claude Code Local. Run Claude Code 100% on-device on Apple Silicon. Current lineup led by Qwen 3.8 27B and Gemma 4 31B, four modes (code, browser, voice, phone), Anthropic-compatible MLX server, setup.sh picks the right model for your RAM. Your code never leaves your Mac. Featured in Awesome Claude Code. MLX · Apple Silicon · Claude Code · Python. Browser Broker. One logged-in browser, many agents, nobody fights. Leases each agent an ordinary background tab in your real browser, with your real logins, and every agent sees only its own. ~300 lines, one dependency. Verified on Linux by a stranger who then found a bug in my own docs. Chrome DevTools Protocol · Multi-agent · Local AI."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7f6f3a"/><stop offset="1" stop-color="#5f7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="404.0" height="256" rx="10"/></clipPath><rect width="404.0" height="256" rx="10" fill="url(#n)"/><rect width="404.0" height="4" fill="#7f6f3a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="403.0" height="255" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="204" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#dbd6c7">🧠 Claude Code Local</text><text x="204" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Run Claude Code 100% on-device on Apple</text><text x="204" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Silicon. Current lineup led by Qwen 3.8 27B</text><text x="204" text-anchor="middle" y="117" font