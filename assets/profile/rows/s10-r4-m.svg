<svg xmlns="http://www.w3.org/2000/svg" width="358" height="328" viewBox="0 0 358 328" role="img" aria-label="The honest goal. A Lego-clip-in modular robotics kit running the same local-AI brain as the desk. VisionBuilder trains its eyes from photos on my phone. Jetson Orin Nano · YOLOv8 · Teensy · RPLidar · Robotics. Also on the bench: Run + Sit Exo. A powered knee exoskeleton design I&#x27;m working on. It&#x27;s a design and prototype, not a finished product."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="193" rx="10"/></clipPath><rect width="358.0" height="193" rx="10" fill="#161b22"/><rect width="4" height="193" fill="#d4a95a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="192" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🧱 The honest goal</text><text x="19" y="65" font-size="16" fill="#c9d1d9">A Lego-clip-in modular robotics kit running</text><text x="19" y="87" font-size="16" fill="#c9d1d9">the same local-AI brain as the desk.</text><text x="19" y="110" font-size="16" fill="#c9d1d9">VisionBuilder trains its eyes from photos on</text><text x="19" y="133" font-size="16" fill="#c9d1d9">my phone.</text><text x="19" y="159" font-size="14" font-weight="600" fill="#d4a95a">Jetson Orin Nano · YOLOv8 · Teensy ·</text><text x="19" y="178" font-size="14" font-weight="600" fill="#d4a95a">RPLidar · Robotics</text></g><g transform="translate(0.0,203)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="#161b22"/><rect width="4" height="125" fill="#6fbf8a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="#30363d"/><text x="19" y="36" font-size="18" font-weight="700" fill="#e6edf3">🦿 Also on the bench: Run + Sit Exo</text><text x="19" y="65" font-size="16" fill