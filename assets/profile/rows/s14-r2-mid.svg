<svg xmlns="http://www.w3.org/2000/svg" width="560" height="339" viewBox="0 0 560 339" role="img" aria-label="THE SHOWCASE. AirGap AI. What a full private-AI build looks like for the kind of firm that cannot put its data into a cloud chatbot. It&#x27;s a capability I maintain, not a product I&#x27;m pushing. The three-node mesh is the demo: it&#x27;s been my daily driver for a year and a half. THE LONG ARC. The long arc is the robot. Same eyes, different bodies. Still figuring it out. No investors. One MacBook, one Mac mini, one VPS, and a lot of late nights."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f4f7f"/><stop offset="1" stop-color="#8a4f5f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="371.8" height="225" rx="10"/></clipPath><rect width="371.8" height="225" rx="10" fill="url(#n)"/><rect width="371.8" height="4" fill="#6f4f7f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="370.8" height="224" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><rect x="124" y="13" width="128" height="22" rx="11.0" fill="none" stroke="#fff3c4"/><text x="188" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#fff3c4" letter-spacing=".6">THE SHOWCASE</text><text x="188" text-anchor="middle" y="68" font-size="18" font-weight="700" fill="#beafc5">AirGap AI</text><text x="188" text-anchor="middle" y="97" font-size="16" fill="#d6dce6">What a full private-AI build looks like for the</text><text x="188" text-anchor="middle" y="119" font-size="16" fill="#d6dce6">kind of firm that cannot put its data into a</text><text x="188" text-anchor="middle" y="142" font-size="16" fill="#d6dce6">cloud chatbot. It&#x27;s a capability I maintain, not</text><text 