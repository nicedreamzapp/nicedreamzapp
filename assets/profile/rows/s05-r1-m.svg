<svg xmlns="http://www.w3.org/2000/svg" width="358" height="575" viewBox="0 0 358 575" role="img" aria-label="Trinidad Head. My own terminal, built from scratch for Windows and Mac. Glass windows with a neon glow. A different color for every open window. Your own questions easy to spot when you scroll back through an AI chat. nemotron-omni-mlx. NVIDIA&#x27;s Nemotron Omni sees, hears, and reasons. Its vision and audio towers had no open runtime for Apple Silicon. So I wrote one. Pure MLX, MIT. The numbers. 23/23 parity tests against NVIDIA&#x27;s PyTorch reference. 67.7 tok/s with an image, end to end. 110.5 tok/s with audio, end to end. On an M5 Max, wifi off."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4f8f"/><stop offset="1" stop-color="#7a4f86"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="202" rx="10"/></clipPath><rect width="358.0" height="202" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="357.0" height="201" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">🖥️ Trinidad Head</text><text x="19" y="65" font-size="16" fill="#f1f4fa">My own terminal, built from scratch for</text><text x="19" y="87" font-size="16" fill="#f1f4fa">Windows and Mac.</text><text x="19" y="113" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="113" font-size="16" fill="#f1f4fa">Glass windows with a neon glow</text><text x="19" y="138" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="138" font-size="16" fill="#f1f4fa">A different color for every open window</text><text x="19" y="164" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="164" font-size="16" fill="#f1f4fa">Your own questions easy to spot when</text><text x="31" y="187" font-size="16" fill="#f1f4fa">you scroll back through an AI chat</text></g><g transform="translate(0.0,212)"><clipPath id="c1_0"><rect width="358.0" height="174" rx="10"/></clipPath><rect width="358.0" height="174" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="357.0" height="173" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">👁️ nemotron-omni-mlx</text><text x="181" text-anchor="middle" y="65" font-size="16" fill="#f1f4fa">NVIDIA&#x27;s Nemotron Omni sees, hears, and</text><text x="181" text-anchor="middle" y="87" font-size="16" fill="#f1f4fa">reasons. Its vision and audio towers had no</text><text x="181" text-anchor="middle" y="110" font-size="16" fill="#f1f4fa">open runtime for Apple Silicon. So I wrote</text><text x="181" text-anchor="middle" y="133" font-size="16" fill="#f1f4fa">one.</text><text x="181" text-anchor="middle" y="159" font-size="14" font-weight="600" fill="#fff3c4">Pure MLX, MIT</text></g><g transform="translate(0.0,396)"><clipPath id="c2_0"><rect width="358.0" height="179" rx="10"/></clipPath><rect width="358.0" height="179" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="357.0" height="178" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">⚡ The numbers</text><text x="19" y="65" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="65" font-size="16" fill="#f1f4fa">23/23 parity tests against NVIDIA&#x27;s</text><text x="31" y="87" font-size="16" fill="#f1f4fa">PyTorch reference</text><text x="19" y="113" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="113" font-size="16" fill="#f1f4fa">67.7 tok/s with an image, end to end</text><text x="19" y="138" font-size="16" font-weight="800" fill="#d9fbe8">•</text><text x="31" y="138" font-size="16" fill="#f1f4fa">110.5 tok/s with audio, end to end</text><text x="19" y="164" font-s