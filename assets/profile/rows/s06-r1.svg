<svg xmlns="http://www.w3.org/2000/svg" width="820" height="157" viewBox="0 0 820 157" role="img" aria-label="What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all. Now picture a village. Two of them, dropped where people are hungry and there&#x27;s no signal for a hundred miles."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7f5f"/><stop offset="1" stop-color="#6a7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="251.3" height="157" rx="10"/></clipPath><rect width="251.3" height="157" rx="10" fill="url(#n)"/><rect width="251.3" height="4" fill="#4f7f5f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="250.3" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="128" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">🧺 What it does</text><text x="128" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">It plants, waters, weeds,</text><text x="128" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">harvests, carries the food</text><text x="128" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">in, and someday maybe</text><text x="128" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">cooks it too.</text></g><g transform="translate(263.3,0)"><clipPath id="c0_1"><rect width="275.6" height="157" rx="10"/></clipPath><rect width="275.6" height="157" rx="10" fill="url(#n)"/><rect width="275.6" height="4" fill="#4f7f5f" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="274.6" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="140" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">☀️ No grid, no cloud</text><text x="140" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">It charges from the sun and</text><text x="140" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">its whole brain lives inside it,</text><text x="140" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">so it keeps working where</text><text x="140" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">there&#x27;s no internet at all.</text></g><g transform="translate(550.9,0)"><clipPath id="c0_2"><rect width="269.1" height="157" rx="10"/></clipPath><rect width="269.1" height="157" rx="10" fill="url(#n)"/><rect width="269.1" height="4" fill="#4f7f5f" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="268.1" height="156" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="137" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cddbd2">🏘️ Now picture a</text><text x="137" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#cddbd2">village</text><text x="137" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">Two of them, dropped where</text><text x="137" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">people are hungry and there&#x27;s</text><text x="137" text-anchor="middle" y="141" font-size="17" font-weight="500" fill="#f2f5fa">no signal for a hundred miles.</text></g></g></svg>
