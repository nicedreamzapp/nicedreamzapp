<svg xmlns="http://www.w3.org/2000/svg" width="560" height="283" viewBox="0 0 560 283" role="img" aria-label="Now picture a village. Now picture dropping two of them in a village where people are hungry and there&#x27;s no signal for a hundred miles. They dig the well, plant the rows, and bring in the harvest. That&#x27;s the science fiction story I&#x27;m building toward, and I think we&#x27;re closer to it than most people realize. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="343.1" height="171" rx="10"/></clipPath><rect width="343.1" height="171" rx="10" fill="url(#g)"/><rect width="4" height="171" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="342.1" height="170" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🏘️ Now picture a village</text><text x="19" y="65" font-size="16" fill="#eef2fa">Now picture dropping two of them in a</text><text x="19" y="87" font-size="16" fill="#eef2fa">village where people are hungry and</text><text x="19" y="110" font-size="16" fill="#eef2fa">there&#x27;s no signal for a hundred miles.</text><text x="19" y="133" font-size="16" fill="#eef2fa">They dig the well, plant the rows, and</text><text x="19" y="156" font-size="16" fill="#eef2fa">bring in the harvest.</text></g><g transform="translate(353.1,0)"><clipPath id="c0_1"><rect width="206.9" height="171" rx="10"/></clipPath><rect width="206.9" height="171" rx="10" fill="url(#g)"/><rect width="4" height="171" fill="#ffd88a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="205.9" height="170" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="16.5" font-style="italic" fill="#eef2fa">That&#x27;s the science</text><text x="19" y="60" font-size="16.5" font-style="italic" fill="#eef2fa">fiction story I&#x27;m</text><text x="19" y="83" font-size="16.5" font-style="italic" fill="#eef2fa">building toward, and I</text><text x="19" y="107" font-size="16.5" font-style="italic" fill="#eef2fa">think we&#x27;re closer to it</text><text x="19" y="130" font-size="16.5" font-style="italic" fill="#eef2fa">than most people</text><text x="19" y="154" font-size="16.5" font-style="italic" fill="#eef2fa">realize.</text></g><g transform="translate(0.0,181)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#g)"/><rect width="4" height="102" fill="#a7f0c2" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🧩 Every repo on this page is a piece of it.</text><text x="19" y="65" font-size="16" fill="#eef2fa">Right now I&#x27;m scraping the edges, but every piece works with the wifi</text><text x="19" y="87" font-size="16" fill="#eef2fa">off, and that&#x27;s on purpose.</text></g></g></svg>
