<svg xmlns="http://www.w3.org/2000/svg" width="358" height="397" viewBox="0 0 358 397" role="img" aria-label="Here&#x27;s where all of this is headed. You hand a robot a bag of seeds, show it where the hose is, and a few months later there are vegetables on the table. What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7f5f"/><stop offset="1" stop-color="#6a7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="127" rx="10"/></clipPath><rect width="358.0" height="127" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="126" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#afc5b7">🌱 Here&#x27;s where all of this is headed.</text><text x="181" text-anchor="middle" y="65" font-size="16.5" font-style="italic" fill="#d6dce6">You hand a robot a bag of seeds, show it</text><text x="181" text-anchor="middle" y="89" font-size="16.5" font-style="italic" fill="#d6dce6">where the hose is, and a few months later</text><text x="181" text-anchor="middle" y="112" font-size="16.5" font-style="italic" fill="#d6dce6">there are vegetables on the table.</text></g><g transform="translate(0.0,137)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#afc5b7">🧺 What it does</text><text x="181" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">It plants, waters, weeds, harvests, carries</text><text x="181" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">the food in, and someday maybe cooks it</text><text x="181" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">too.</text></g><g transform="translate(0.0,272)"><clipPath id="c2_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#afc5b7">☀️ No grid, no cloud</text><text x="181" text-anchor="middle" y="65" font-size="16" fill="#d6dce6">It charges from the sun and its whole brain</text><text x="181" text-anchor="middle" y="87" font-size="16" fill="#d6dce6">lives inside it, so it keeps working where</text><text x="181" text-anchor="middle" y="110" font-size="16" fill="#d6dce6">there&#x27;s no internet at all.</text></g></g></svg>
