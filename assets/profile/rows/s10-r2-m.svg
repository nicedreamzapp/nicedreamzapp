<svg xmlns="http://www.w3.org/2000/svg" width="358" height="437" viewBox="0 0 358 437" role="img" aria-label="Now picture a village. Now picture dropping two of them in a village where people are hungry and there&#x27;s no signal for a hundred miles. They dig the well, plant the rows, and bring in the harvest. That&#x27;s the science fiction story I&#x27;m building toward, and I think we&#x27;re closer to it than most people realize. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d6098"/><stop offset="1" stop-color="#54458f"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="171" rx="10"/></clipPath><rect width="358.0" height="171" rx="10" fill="url(#g)"/><rect width="4" height="171" fill="#a7f0c2" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="170" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🏘️ Now picture a village</text><text x="19" y="65" font-size="16" fill="#eef2fa">Now picture dropping two of them in a</text><text x="19" y="87" font-size="16" fill="#eef2fa">village where people are hungry and</text><text x="19" y="110" font-size="16" fill="#eef2fa">there&#x27;s no signal for a hundred miles. They</text><text x="19" y="133" font-size="16" fill="#eef2fa">dig the well, plant the rows, and bring in the</text><text x="19" y="156" font-size="16" fill="#eef2fa">harvest.</text></g><g transform="translate(0.0,181)"><clipPath id="c1_0"><rect width="358.0" height="98" rx="10"/></clipPath><rect width="358.0" height="98" rx="10" fill="url(#g)"/><rect width="4" height="98" fill="#ffd88a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="97" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="16.5" font-style="italic" fill="#eef2fa">That&#x27;s the science fiction story I&#x27;m building</text><text x="19" y="60" font-size="16.5" font-style="italic" fill="#eef2fa">toward, and I think we&#x27;re closer to it than</text><text x="19" y="83" font-size="16.5" font-style="italic" fill="#eef2fa">most people realize.</text></g><g transform="translate(0.0,289)"><clipPath id="c2_0"><rect width="358.0" height="148" rx="10"/></clipPath><rect width="358.0" height="148" rx="10" fill="url(#g)"/><rect width="4" height="148" fill="#a7f0c2" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="147" rx="10" fill="none" stroke="#7f93c9"/><text x="19" y="36" font-size="18" font-weight="700" fill="#ffffff">🧩 Every repo on this page is a piece</text><text x="19" y="59" font-size="18" font-weight="700" fill="#ffffff">of it.</text><text x="19" y="88" font-size="16" fill="#eef2fa">Right now I&#x27;m scraping the edges, but every</text><text x="19" y="111" font-size="16" fill="#eef2fa">piece works with the wifi off, and that&#x27;s on</text><text x="19" y="133" font-size="16" fill="#eef2fa">purpose.</text></g></g></svg>
