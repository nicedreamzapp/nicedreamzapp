<svg xmlns="http://www.w3.org/2000/svg" width="358" height="418" viewBox="0 0 358 418" role="img" aria-label="What it does. It plants, waters, weeds, harvests, carries the food in, and someday maybe cooks it too. No grid, no cloud. It charges from the sun and its whole brain lives inside it, so it keeps working where there&#x27;s no internet at all. Every repo on this page is a piece of it. Right now I&#x27;m scraping the edges, but every piece works with the wifi off, and that&#x27;s on purpose."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7f5f"/><stop offset="1" stop-color="#6a7a3f"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">🧺 What it does</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">It plants, waters, weeds, harvests, carries</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">the food in, and someday maybe cooks it</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">too.</text></g><g transform="translate(0.0,135)"><clipPath id="c1_0"><rect width="358.0" height="125" rx="10"/></clipPath><rect width="358.0" height="125" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="124" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">☀️ No grid, no cloud</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">It charges from the sun and its whole brain</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">lives inside it, so it keeps working where</text><text x="181" text-anchor="middle" y="110" font-size="16" font-weight="500" fill="#f2f5fa">there&#x27;s no internet at all.</text></g><g transform="translate(0.0,270)"><clipPath id="c2_0"><rect width="358.0" height="148" rx="10"/></clipPath><rect width="358.0" height="148" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7f5f" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="147" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cddbd2">🧩 Every repo on this page is a piece</text><text x="181" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#cddbd2">of it.</text><text x="181" text-anchor="middle" y="88" font-size="16" font-weight="500" fill="#f2f5fa">Right now I&#x27;m scraping the edges, but every</text><text x="181" text-anchor="middle" y="111" font-size="16" font-weight="500" fill="#f2f5fa">piece works with the wifi off, and that&#x27;s on</text><text x="181" text-anchor="middle" y="133" font-size="16" font-weight="500" fill="#f2f5fa">purpose.</text></g></g></svg>
