<svg xmlns="http://www.w3.org/2000/svg" width="560" height="285" viewBox="0 0 560 285" role="img" aria-label="Most of these repos look standalone. They&#x27;re not. They&#x27;re one system spread across three machines that talk to each other 24/7. The idea. Apple Silicon is fast enough now that the everyday AI I want does not need a cloud subscription. Build local-first, stay useful when the internet goes down. Airgap-ready. The same stack is airgap-ready, which matters to the law / medical / compliance-sensitive firms I work with through Nice Dreamz LLC."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a4a"/><stop offset="1" stop-color="#8a4f5a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="255.1" height="173" rx="10"/></clipPath><rect width="255.1" height="173" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="254.1" height="172" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="130" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">🧩 Most of these repos</text><text x="130" text-anchor="middle" y="59" font-size="18" font-weight="700" fill="#ffffff">look standalone. They&#x27;re</text><text x="130" text-anchor="middle" y="82" font-size="18" font-weight="700" fill="#ffffff">not.</text><text x="130" text-anchor="middle" y="112" font-size="16.5" font-style="italic" fill="#f1f4fa">They&#x27;re one system spread</text><text x="130" text-anchor="middle" y="135" font-size="16.5" font-style="italic" fill="#f1f4fa">across three machines that</text><text x="130" text-anchor="middle" y="158" font-size="16.5" font-style="italic" fill="#f1f4fa">talk to each other 24/7.</text></g><g transform="translate(265.1,0)"><clipPath id="c0_1"><rect width="294.9" height="173" rx="10"/></clipPath><rect width="294.9" height="173" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="293.9" height="172" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">💡 The idea</text><text x="19" y="65" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="65" font-size="16" fill="#f1f4fa">Apple Silicon is fast enough now</text><text x="31" y="87" font-size="16" fill="#f1f4fa">that the everyday AI I want does</text><text x="31" y="110" font-size="16" fill="#f1f4fa">not need a cloud subscription.</text><text x="19" y="136" font-size="16" font-weight="800" fill="#fff3c4">•</text><text x="31" y="136" font-size="16" fill="#f1f4fa">Build local-first, stay useful when</text><text x="31" y="158" font-size="16" fill="#f1f4fa">the internet goes down.</text></g><g transform="translate(0.0,183)"><clipPath id="c1_0"><rect width="560.0" height="102" rx="10"/></clipPath><rect width="560.0" height="102" rx="10" fill="url(#g)"/><rect x=".5" y=".5" width="559.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="282" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#ffffff">🔒 Airgap-ready</text><text x="282" text-anchor="middle" y="65" font-size="16" fill="#f1f4fa">The same stack is airgap-ready, which matters to the law / medical /</text><text x="282" text-anchor="middle" y="87" font-size="16" fill="#f1f4fa">compliance-sensitive firms I work with through Nice Dreamz LLC.</text></g></g></svg>
