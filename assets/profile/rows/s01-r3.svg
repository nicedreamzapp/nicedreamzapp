<svg xmlns="http://www.w3.org/2000/svg" width="820" height="129" viewBox="0 0 820 129" role="img" aria-label="Next: a robot that grows food. The bigger idea: robots that give people back what they have lost. Dozens of repos later I am somehow doing neuroscience, and every one of them still traces back to the coop."><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="469.2" height="129" rx="10"/></clipPath><rect width="469.2" height="129" rx="10" fill="#161b22"/><rect width="4" height="129" fill="#6fbf8a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="468.2" height="128" rx="10" fill="none" stroke="#30363d"/><text x="20" y="38" font-size="19" font-weight="700" fill="#e6edf3">🌱 Next: a robot that grows food.</text><text x="20" y="68" font-size="17" fill="#c9d1d9">The bigger idea: robots that give people back what</text><text x="20" y="93" font-size="17" fill="#c9d1d9">they have lost.</text></g><g transform="translate(481.2,0)"><clipPath id="c0_1"><rect width="338.8" height="129" rx="10"/></clipPath><rect width="338.8" height="129" rx="10" fill="#161b22"/><rect width="4" height="129" fill="#d4a95a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="337.8" height="128" rx="10" fill="none" stroke="#30363d"/><text x="20" y="39" font-size="17.5" font-style="italic" fill="#c9d1d9">Dozens of repos later I am</text><text x="20" y="64" font-size="17.5" font-style="italic" fill="#c9d1d9">somehow doing neuroscience, and</text><text x="20" y="89" font-size="17.5" font-style="italic" fill="#c9d1d9">every one of them still traces back</text><text x="20" y="113" font-size="17.5" font-style="italic" fill="#c9d1d9">to the coop.</text></g></g></svg>
