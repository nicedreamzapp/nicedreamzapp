<svg xmlns="http://www.w3.org/2000/svg" width="820" height="134" viewBox="0 0 820 134" role="img" aria-label="AirGap is my name for the full private-AI build. A complete AI workstation on one Mac, wifi off, nothing leaving the building. A capability I keep sharp. It started as a packaged offering; these days I treat it as a capability I keep sharp rather than something I sell."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f6f96"/><stop offset="1" stop-color="#2f7f86"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4252"/><stop offset="1" stop-color="#30374a"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="423.1" height="134" rx="10"/></clipPath><rect width="423.1" height="134" rx="10" fill="url(#n)"/><rect width="423.1" height="4" fill="#3f6f96" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="422.1" height="133" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="214" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#a8becf">🔒 AirGap is my name for the full</text><text x="214" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#a8becf">private-AI build.</text><text x="214" text-anchor="middle" y="93" font-size="17.5" font-style="italic" fill="#d6dce6">A complete AI workstation on one Mac, wifi</text><text x="214" text-anchor="middle" y="118" font-size="17.5" font-style="italic" fill="#d6dce6">off, nothing leaving the building.</text></g><g transform="translate(435.1,0)"><clipPath id="c0_1"><rect width="384.9" height="134" rx="10"/></clipPath><rect width="384.9" height="134" rx="10" fill="url(#n)"/><rect width="384.9" height="4" fill="#3f6f96" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="383.9" height="133" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="194" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#a8becf">🧰 A capability I keep sharp</text><text x="194" text-anchor="middle" y="68" font-size="17" fill="#d6dce6">It started as a packaged offering; these</text><text x="194" text-anchor="middle" y="93" font-size="17" fill="#d6dce6">days I treat it as a capability I keep sharp</text><text x="194" text-anchor="middle" y="117" font-size="17" fill="#d6dce6">rather than something I sell.</text></g></g></svg>
